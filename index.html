<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Speaking Lab · Teacher Panel</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  :root{
    --bg:#07090f; --panel:#121620; --panel2:#1a202e; --border:#2a3149;
    --text:#eef1f8; --muted:#8b93ad;
    --accent:#7c5cff; --accent2:#22d3ee;
    --green:#22c55e; --yellow:#eab308; --red:#ef4444;
  }
  body{
    font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    background:var(--bg); color:var(--text);
    display:flex; justify-content:center; align-items:flex-start;
    min-height:100vh; padding:20px;
  }
  .app-container{
    width:100%; max-width:900px;
    display:flex; flex-direction:column; gap:16px;
  }
  
  /* HEADER STATUS */
  .header-status{
    display:flex; justify-content:space-between; align-items:center;
    background:var(--panel); border:1px solid var(--border);
    border-radius:16px; padding:16px 24px;
    box-shadow:0 10px 30px -10px rgba(0,0,0,0.5);
  }
  .status-indicator{
    font-size:14px; font-weight:800; letter-spacing:1px; text-transform:uppercase;
    color:var(--accent2);
  }
  .status-details{
    display:flex; gap:16px; font-size:14px; color:var(--muted);
  }
  .status-details span{ color:var(--text); font-weight:700; }

  /* STUDENT VIEW REPLICA */
  .image-container{
    position:relative; width:100%; height:280px;
    border-radius:20px; overflow:hidden;
    background:var(--panel); border:1px solid var(--border);
  }
  .image-container img{
    width:100%; height:100%; object-fit:cover; display:block;
    transition:opacity 0.8s ease;
  }
  .image-overlay{
    position:absolute; inset:0;
    background:linear-gradient(180deg, transparent 40%, rgba(7,9,15,0.95) 100%);
  }
  .section-badge{
    position:absolute; top:16px; left:16px;
    background:rgba(7,9,15,.8); backdrop-filter:blur(8px);
    border:1px solid var(--border); padding:6px 16px; border-radius:100px;
    font-size:12px; font-weight:800; letter-spacing:2px; text-transform:uppercase;
    color:var(--accent2);
  }

  .question-container{
    background:var(--panel); border:1px solid var(--border);
    border-radius:20px; padding:24px; min-height:110px;
    display:flex; align-items:center;
  }
  .question-text{
    font-size:clamp(18px, 2.5vw, 24px); font-weight:600; line-height:1.4;
    transition: opacity 0.5s, transform 0.5s, filter 0.5s;
  }
  .question-text.locked { opacity: 0; transform: translateY(20px); filter: blur(8px); }
  .question-text.unlocked { opacity: 1; transform: translateY(0); filter: blur(0); }

  .timer-container{
    background:var(--panel); border:1px solid var(--border);
    border-radius:20px; padding:16px 24px;
    display:flex; align-items:center; gap:16px;
  }
  .timer-phase{
    font-size:12px; font-weight:800; letter-spacing:2px; text-transform:uppercase;
    color:var(--muted); width:60px;
  }
  .timer-time{
    font-size:28px; font-weight:800; font-variant-numeric:tabular-nums;
    width:80px; text-align:right;
  }
  .timer-bar{
    flex:1; height:10px; background:var(--panel2);
    border-radius:100px; overflow:hidden; position:relative;
  }
  .timer-fill{
    position:absolute; top:0; left:0; bottom:0;
    transition: width 0.1s linear, background 0.3s;
    border-radius:100px;
  }
  .phase-think { color:var(--yellow) !important; }
  .phase-talk { color:var(--green) !important; }
  .phase-done { color:var(--red) !important; }
  
  .fill-think { background:linear-gradient(90deg,var(--yellow),#facc15); }
  .fill-talk { background:linear-gradient(90deg,var(--green),#4ade80); }
  .fill-warn { background:linear-gradient(90deg,#f59e0b,var(--red)); }
  .fill-danger { background:linear-gradient(90deg,var(--red),#dc2626); }

  /* CONTROLS */
  .controls-panel{
    display:flex; gap:10px; flex-wrap:wrap; justify-content:center;
    background:var(--panel); padding:16px; border-radius:20px;
    border:1px solid var(--border);
  }
  .btn {
    padding:12px 20px; border-radius:12px; border:none;
    font-family:inherit; font-size:14px; font-weight:700; cursor:pointer;
    transition:transform 0.1s, filter 0.15s; display:flex; align-items:center; gap:8px;
    flex:1; justify-content:center; min-width:120px;
  }
  .btn:active { transform:scale(0.97); }
  .btn-primary { background:linear-gradient(90deg,var(--accent),var(--accent2)); color:#fff; }
  .btn-secondary { background:var(--panel2); color:var(--text); border:1px solid var(--border); }
  .btn-danger { background:rgba(239,68,68,0.15); color:var(--red); border:1px solid rgba(239,68,68,0.3); }
  .btn:hover { filter:brightness(1.1); }
  .btn:disabled { opacity:0.4; cursor:not-allowed; }
</style>
</head>
<body>

<div class="app-container">
  
  <!-- Status Bar -->
  <div class="header-status">
    <div class="status-indicator">Teacher Control</div>
    <div class="status-details">
      <div>Section: <span id="statSection">1</span> / 3</div>
      <div>Question: <span id="statQuestion">1</span> / 9</div>
      <div>Status: <span id="statStatus" style="color:var(--yellow)">Idle</span></div>
    </div>
  </div>

  <!-- Visual Replica -->
  <div class="image-container">
    <img id="teacherImage" src="" alt="Section Image" style="opacity:0;">
    <div class="image-overlay"></div>
    <div class="section-badge" id="teacherBadge">Loading...</div>
  </div>

  <div class="question-container">
    <div class="question-text locked" id="teacherQuestion">Loading...</div>
  </div>

  <div class="timer-container">
    <div class="timer-phase" id="teacherPhase">Wait</div>
    <div class="timer-time" id="teacherTime">3:20</div>
    <div class="timer-bar">
      <div class="timer-fill" id="teacherFill" style="width:100%"></div>
    </div>
  </div>

  <!-- Control Buttons -->
  <div class="controls-panel">
    <button class="btn btn-secondary" id="prevBtn">◀ Previous</button>
    <button class="btn btn-primary" id="playBtn">▶ Start / Resume</button>
    <button class="btn btn-secondary" id="nextBtn">Next ▶</button>
    <button class="btn btn-danger" id="resetBtn">↺ Reset All</button>
    <button class="btn btn-secondary" id="voiceBtn">🔊 Voice ON</button>
  </div>

</div>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
<script>
(function(){
  'use strict';

  // ---- FIREBASE SETUP ----
  firebase.initializeApp({
    databaseURL: "https://english-meetings-f08e4-default-rtdb.firebaseio.com"
  });
  const db = firebase.database();
  const ROOM_ID = 'speakingLab'; // Must match student.html

  // ---- DATA ----
  const SECTIONS = [
    {
      badge: "Section 1 · Psychology",
      image: "https://lindastade.com/wp-content/uploads/2020/10/shutterstock_200319638.jpg",
      questions: [
        "Describe the scene and steps to both avoid it from happening and to remediate if it's happening.",
        "What are the psychological effects of social exclusion on teenagers?",
        "Have you ever witnessed or experienced bullying? How did it affect the school environment?",
        "How can teachers identify students who are being isolated?",
        "What role do parents play in preventing school violence?",
        "How does social media influence social hierarchies in schools?",
        "Is there a difference between physical bullying and emotional exclusion? Which is worse?",
        "How can schools create a culture of inclusion rather than competition?",
        "If you were a school principal, what is the first rule you would implement to stop bullying?"
      ]
    },
    {
      badge: "Section 2 · Science & Tech",
      image: "https://images.unsplash.com/photo-1485827404703-89b55fcc595e?auto=format&fit=crop&w=1200&q=80",
      questions: [
        "Talk about the Future of work and how we can get ready for it.",
        "What human skills will be most valuable when robots and AI take over repetitive tasks?",
        "Do you think AI will create more jobs than it destroys? Why?",
        "How can companies retrain their employees to work alongside AI?",
        "What ethical concerns arise from replacing human workers with robots?",
        "How do you feel about having an AI as a manager or colleague?",
        "What is the most important technological skill to learn right now?",
        "Could a machine ever truly replace the creativity of a human being?",
        "How should education systems change to prepare the next generation for this future?"
      ]
    },
    {
      badge: "Section 3 · Professional",
      image: "https://images.unsplash.com/photo-1522071820081-009f0129c71c?auto=format&fit=crop&w=1200&q=80",
      questions: [
        "What are the necessary steps to be fully engaged, satisfied and happy at work, getting along well with the team and growing in your career?",
        "What is the difference between a good manager and a bad manager?",
        "How do you handle conflict with a coworker you don't like?",
        "Is it possible to be happy at work if you don't love your job? How?",
        "What are the key factors for a team to function well together?",
        "How do you balance ambition and career growth with personal well-being?",
        "Describe a time you felt extremely motivated at work or school. What caused it?",
        "What does a healthy company culture look like to you?",
        "How can you tell if a company is the right fit for you during an interview?"
      ]
    }
  ];

  const TOTAL_SECONDS = 200; 
  const THINK_SECONDS = 20;
  const Q_PER_SECTION = 9;

  // ---- STATE ----
  let currentSec = 0;
  let currentQ = 0;
  let timeLeft = TOTAL_SECONDS;
  let isRunning = false;
  let voiceOn = true;
  let timerId = null;
  let lastTick = null;
  let isFinished = false;
  let lastQText = '';

  const stateRef = db.ref('rooms/' + ROOM_ID + '/state');

  // ---- DOM ----
  const $ = id => document.getElementById(id);
  const els = {
    statSec: $('statSection'),
    statQ: $('statQuestion'),
    statStatus: $('statStatus'),
    image: $('teacherImage'),
    badge: $('teacherBadge'),
    qText: $('teacherQuestion'),
    phase: $('teacherPhase'),
    time: $('teacherTime'),
    fill: $('teacherFill'),
    play: $('playBtn'),
    prev: $('prevBtn'),
    next: $('nextBtn'),
    reset: $('resetBtn'),
    voice: $('voiceBtn')
  };

  // ---- UTILS ----
  function fmt(s) {
    s = Math.max(0, Math.ceil(s));
    return Math.floor(s/60) + ':' + String(s%60).padStart(2,'0');
  }

  // ---- UPDATE UI (Teacher sees exactly what student sees) ----
  function updateUI(flash = false) {
    const sec = SECTIONS[currentSec];
    const qText = sec.questions[currentQ];

    // Update Top Bar Status
    els.statSec.textContent = currentSec + 1;
    els.statQ.textContent = currentQ + 1;
    els.statStatus.textContent = isFinished ? 'Finished' : (isRunning ? 'Running' : 'Paused');
    els.statStatus.style.color = isFinished ? 'var(--red)' : (isRunning ? 'var(--green)' : 'var(--yellow)');

    // Update Image
    els.badge.textContent = sec.badge;
    if (els.image.dataset.src !== sec.image) {
      els.image.style.opacity = '0';
      setTimeout(() => {
        els.image.src = sec.image;
        els.image.dataset.src = sec.image;
        els.image.onload = () => { els.image.style.opacity = '1'; };
      }, 200);
    }

    // Update Question Text
    if (qText !== lastQText) {
      els.qText.classList.remove('unlocked');
      els.qText.classList.add('locked');
      setTimeout(() => {
        els.qText.textContent = qText;
        els.qText.classList.remove('locked');
        els.qText.classList.add('unlocked');
        lastQText = qText;
      }, flash ? 500 : 0);
    }

    // Update Timer
    const t = Math.max(0, timeLeft);
    let phase = 'Wait';
    let cls = '';

    if (isFinished) {
      phase = 'Done'; cls = 'done';
    } else if (isRunning && t > 0) {
      if (t > TOTAL_SECONDS - THINK_SECONDS) {
        phase = 'Think'; cls = 'think';
        els.time.textContent = Math.ceil(t - (TOTAL_SECONDS - THINK_SECONDS)) + 's';
      } else {
        phase = 'Talk'; cls = 'talk';
        els.time.textContent = fmt(t);
      }
    } else if (t <= 0) {
      phase = 'Done'; cls = 'done';
      els.time.textContent = '0:00';
    } else {
      phase = 'Paused'; cls = '';
      els.time.textContent = fmt(t);
    }

    els.phase.textContent = phase;
    els.phase.className = 'timer-phase phase-' + cls;
    els.time.className = 'timer-time phase-' + cls;
    els.fill.style.width = ((t / TOTAL_SECONDS) * 100) + '%';

    let fillCls = 'fill-talk';
    if (t <= 10) fillCls = 'fill-danger';
    else if (t <= 30) fillCls = 'fill-warn';
    else if (t > TOTAL_SECONDS - THINK_SECONDS) fillCls = 'fill-think';
    els.fill.className = 'timer-fill ' + fillCls;
  }

  // ---- PUBLISH TO FIREBASE ----
  function publish() {
    stateRef.set({
      currentSection: currentSec,
      currentQuestion: currentQ,
      timeLeft: timeLeft,
      isRunning: isRunning,
      voiceOn: voiceOn
    });
  }

  // ---- LOCAL TIMER LOGIC ----
  function tick() {
    if (!isRunning) return;
    const now = Date.now();
    if (lastTick === null) { lastTick = now; return; }
    const delta = (now - lastTick) / 1000;
    lastTick = now;

    timeLeft -= delta;

    if (timeLeft <= 0) {
      timeLeft = 0;
      stopTimer();
      publish();
      setTimeout(() => advance(true), 600);
      return;
    }
    
    updateUI(false);
    if (Math.floor(timeLeft * 10) % 10 === 0) { // Publish roughly every 1s
      publish();
    }
  }

  function startTimer() {
    if (isRunning || isFinished) return;
    isRunning = true;
    lastTick = null;
    timerId = setInterval(tick, 100);
    els.play.textContent = '⏸ Pause';
    updateUI();
    publish();
  }

  function stopTimer() {
    isRunning = false;
    if (timerId) { clearInterval(timerId); timerId = null; }
    els.play.textContent = '▶ Resume';
    updateUI();
    publish();
  }

  // ---- FLOW ----
  function advance(auto = false) {
    if (isFinished) return;
    stopTimer();

    if (currentQ >= Q_PER_SECTION - 1) {
      if (currentSec >= SECTIONS.length - 1) {
        finishAll();
        return;
      }
      currentSec++;
      currentQ = 0;
    } else {
      currentQ++;
    }

    timeLeft = TOTAL_SECONDS;
    isRunning = true;
    
    updateUI(true);
    startTimer();
  }

  function goBack() {
    if (isFinished) return;
    stopTimer();

    if (currentQ === 0) {
      if (currentSec > 0) {
        currentSec--;
        currentQ = Q_PER_SECTION - 1;
      }
    } else {
      currentQ--;
    }

    timeLeft = TOTAL_SECONDS;
    isRunning = true;
    
    updateUI(true);
    startTimer();
  }

  function finishAll() {
    stopTimer();
    isFinished = true;
    els.play.disabled = true;
    els.next.disabled = true;
    updateUI();
    publish();
  }

  function resetAll() {
    stopTimer();
    isFinished = false;
    currentSec = 0;
    currentQ = 0;
    timeLeft = TOTAL_SECONDS;
    isRunning = false;
    els.play.disabled = false;
    els.next.disabled = false;
    els.play.textContent = '▶ Start';
    updateUI(true);
    publish();
  }

  // ---- EVENTS ----
  els.play.onclick = () => { isRunning ? stopTimer() : startTimer(); };
  els.next.onclick = () => advance(false);
  els.prev.onclick = () => goBack();
  els.reset.onclick = () => resetAll();
  els.voice.onclick = () => {
    voiceOn = !voiceOn;
    els.voice.textContent = voiceOn ? '🔊 Voice ON' : '🔇 Voice OFF';
    publish();
  };

  // Keyboard shortcuts
  document.addEventListener('keydown', e => {
    if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
    if (e.code === 'Space') { e.preventDefault(); els.play.click(); }
    if (e.code === 'ArrowRight') { e.preventDefault(); els.next.click(); }
    if (e.code === 'ArrowLeft') { e.preventDefault(); els.prev.click(); }
  });

  // ---- INIT ----
  // Load from Firebase if it exists
  stateRef.once('value').then(snap => {
    const val = snap.val();
    if (val) {
      currentSec = val.currentSection ?? 0;
      currentQ = val.currentQuestion ?? 0;
      timeLeft = val.timeLeft ?? TOTAL_SECONDS;
      isRunning = val.isRunning ?? false;
      voiceOn = val.voiceOn !== false;
      els.voice.textContent = voiceOn ? '🔊 Voice ON' : '🔇 Voice OFF';
    } else {
      publish(); // create initial state
    }
    updateUI(false);
    if (isRunning) startTimer();
  });

})();
</script>
</body>
</html>

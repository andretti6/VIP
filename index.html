<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Reading Club · Debate</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  :root{
    --bg:#0a0807; --card:#171310; --card2:#221c18; --border:#3a2e26;
    --text:#f5f0eb; --muted:#a89a8e; 
    --accent:#f59e0b; --accent2:#ea580c; 
    --green:#22c55e; --success:#10b981;
  }
  body{
    font-family:'Segoe UI',system-ui,-apple-system,sans-serif;
    background:radial-gradient(circle at 20% 0%, #2a1a0f 0%, #0a0807 55%) fixed;
    color:var(--text); min-height:100vh; padding:20px; line-height:1.5;
  }
  .container{max-width:900px;margin:0 auto}

  /* HERO */
  .hero{
    position:relative;height:240px;border-radius:20px;overflow:hidden;margin-bottom:24px;
    background:linear-gradient(135deg,#b45309,#7c2d12);
    box-shadow:0 20px 60px -20px rgba(234,88,12,.4);
  }
  .hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.6}
  .hero::after{
    content:'';position:absolute;inset:0;
    background:linear-gradient(180deg,rgba(10,8,7,.1) 0%,rgba(10,8,7,.6) 45%,rgba(10,8,7,.98) 100%);
  }
  .hero-text{position:absolute;bottom:20px;left:24px;right:24px;z-index:2}
  .hero .tag{
    display:inline-block;font-size:11px;letter-spacing:2px;font-weight:700;color:#fcd34d;
    border:1px solid rgba(245,158,11,.4);padding:4px 10px;border-radius:100px;
    margin-bottom:8px;background:rgba(245,158,11,.1);
  }
  .hero h1{font-size:clamp(22px,4vw,34px);line-height:1.15;text-shadow:0 2px 20px rgba(0,0,0,.8)}
  .hero p{color:#d6c8bc;font-size:14px;margin-top:4px;text-shadow:0 1px 10px #000}

  /* CARD */
  .card{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:24px}
  .hidden{display:none!important}

  /* INPUTS */
  input{
    width:100%;background:var(--card2);border:1px solid var(--border);color:var(--text);
    padding:12px 14px;border-radius:12px;font-size:15px;font-family:inherit;outline:none;
    transition:border-color .15s, box-shadow .15s;
  }
  input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(245,158,11,.15)}
  label{display:block;font-size:13px;color:var(--muted);margin:16px 0 6px;font-weight:600}

  /* BUTTONS */
  button{
    font-family:inherit;font-size:15px;font-weight:600;border-radius:12px;border:none;
    cursor:pointer;padding:12px 18px;transition:transform .1s, filter .15s, background .15s;
  }
  button:active{transform:scale(.98)}
  button:disabled{opacity:.5;cursor:not-allowed}
  .primary{
    width:100%;background:linear-gradient(90deg,var(--accent2),var(--accent));color:#fff;
    box-shadow:0 8px 24px -8px rgba(234,88,12,.6);
  }
  .primary:hover:not(:disabled){filter:brightness(1.1)}
  .ghost{background:var(--card2);color:var(--text);border:1px solid var(--border)}
  .ghost:hover{background:#2e2620}

  /* PLAYERS BAR */
  .players-bar{display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:24px;flex-wrap:wrap}
  .player-chip{
    display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--border);
    padding:8px 14px;border-radius:100px;font-size:14px;font-weight:600;
  }
  .player-chip.me{border-color:rgba(245,158,11,.5);background:rgba(245,158,11,.08)}
  .player-chip small{color:var(--muted);font-weight:400;font-size:12px}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 8px var(--green)}
  .ampersand{font-size:16px;font-weight:800;color:var(--muted)}

  /* GRID LAYOUT FOR PLAYERS */
  .boards-grid{
    display:grid;
    grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
    gap: 20px;
    margin-top: 20px;
  }
  .player-board{
    background:var(--card);border:1px solid var(--border);border-radius:20px;padding:20px;
    box-shadow: 0 10px 30px -10px rgba(0,0,0,0.5);
    display: flex; flex-direction: column;
  }
  .player-board.me{border-color:rgba(245,158,11,.4); box-shadow: 0 0 0 1px rgba(245,158,11,.2);}
  
  .board-header{
    display:flex; align-items:center; gap:10px; margin-bottom:16px;
    padding-bottom:12px; border-bottom:1px solid var(--border);
  }
  .board-header h3{font-size:18px; margin:0;}
  .board-header .pill{
    font-size:10px; font-weight:800; letter-spacing:1px; text-transform:uppercase;
    color:#fff; background:linear-gradient(90deg,var(--accent2),var(--accent));
    padding:4px 10px; border-radius:100px;
  }

  /* QUESTION CARDS */
  .q-grid{display:flex;flex-direction:column;gap:12px;}
  .q-card{
    display:flex; align-items:flex-start; gap:12px; width:100%;
    background:var(--card2);border:1px solid var(--border);border-radius:14px;
    padding:14px 16px; text-align:left; color:var(--text); font-weight:500;
    font-size:14.5px; line-height:1.4; transition: all .3s ease;
    position: relative; overflow: hidden;
  }
  .q-card.completed {
    border-color: rgba(16, 185, 129, 0.4);
    background: rgba(16, 185, 129, 0.05);
  }
  .q-card.completed .q-text {
    text-decoration: line-through;
    color: var(--muted);
  }
  
  .q-content { flex: 1; display: flex; flex-direction: column; gap: 4px; }
  .q-tag{font-size:10px; font-weight:800; letter-spacing:1.2px; text-transform:uppercase; color:var(--accent)}
  .q-text{display:block;}
  
  /* CHECKBOX */
  .check-btn {
    width: 28px; height: 28px; border-radius: 50%;
    border: 2px solid var(--border); background: transparent;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; transition: all 0.2s ease; flex-shrink: 0;
  }
  .check-btn:hover { border-color: var(--accent); background: rgba(245,158,11,0.1); }
  .check-btn svg { width: 16px; height: 16px; fill: none; stroke: var(--muted); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; transition: all 0.2s;}
  .q-card.completed .check-btn { border-color: var(--success); background: var(--success); }
  .q-card.completed .check-btn svg { stroke: #fff; }

  /* CELEBRATION OVERLAY */
  #celebrationOverlay {
    position: fixed; inset: 0; pointer-events: none; z-index: 1000;
    display: flex; align-items: center; justify-content: center;
    opacity: 0; transition: opacity 0.3s ease;
  }
  #celebrationOverlay.show { opacity: 1; }
  .celebration-msg {
    background: rgba(16, 185, 129, 0.95);
    color: white; font-size: 24px; font-weight: 800;
    padding: 20px 40px; border-radius: 20px;
    box-shadow: 0 20px 40px rgba(0,0,0,0.5);
    transform: scale(0.5); transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    text-align: center;
    display: flex; flex-direction: column; align-items: center; gap: 10px;
  }
  #celebrationOverlay.show .celebration-msg { transform: scale(1); }
  .confetti {
    position: absolute; width: 10px; height: 10px;
    background-color: #f59e0b; border-radius: 2px;
    animation: fall 1.5s linear forwards;
  }
  @keyframes fall {
    0% { transform: translateY(-50px) rotate(0deg); opacity: 1; }
    100% { transform: translateY(100vh) rotate(720deg); opacity: 0; }
  }

  /* MISC */
  .err{color:#ff5c7a;font-size:13px;margin-top:10px;min-height:18px}

  @media(max-width:600px){
    body{padding:12px}
    .hero{height:190px}
    .hero h1{font-size:21px}
    .card{padding:18px}
    .player-board{padding:16px;}
  }
</style>
</head>
<body>
<div class="container">

  <header class="hero">
    <img src="https://images.unsplash.com/photo-1524995997946-a1c2e315a42f?auto=format&fit=crop&w=1600&q=80"
         alt="Books and Reading" onerror="this.style.display='none'">
    <div class="hero-text">
      <div class="tag">ORAL DEBATE · READING</div>
      <h1>Books & Reading Habits</h1>
      <p>Ask questions, share your thoughts, and get to know each other.</p>
    </div>
  </header>

  <!-- SCREEN 1: JOIN -->
  <section id="joinCard" class="card">
    <h2 style="margin-bottom:6px">Join the Reading Club</h2>
    <p class="muted">Enter your name to start. The room is ready.</p>

    <label for="nameInput">Your Name</label>
    <input id="nameInput" maxlength="20" placeholder="e.g. John" autocomplete="off">

    <div style="margin-top:20px">
      <button id="joinBtn" class="primary">Enter Room</button>
    </div>
    <div class="err" id="joinErr"></div>
  </section>

  <!-- SCREEN 2: GAME -->
  <section id="game" class="hidden">
    <div class="players-bar" id="playersBar"></div>
    <div class="boards-grid" id="boardsGrid"></div>
  </section>

</div>

<!-- CELEBRATION OVERLAY -->
<div id="celebrationOverlay">
  <div class="celebration-msg" id="celebrationMsg">
    <span>Awesome! 🎉</span>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
<script>
(function(){
  'use strict';

  /* ---------------- FIREBASE ---------------- */
  firebase.initializeApp({
    databaseURL: "https://english-meetings-f08e4-default-rtdb.firebaseio.com"
  });
  const db = firebase.database();

  /* ---------------- HELPERS ---------------- */
  const $ = id => document.getElementById(id);
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => (
    {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]
  ));
  const uid = () => Math.random().toString(36).slice(2,10) + Date.now().toString(36);

  let clientId = localStorage.getItem('reading_client');
  if (!clientId) { clientId = uid(); localStorage.setItem('reading_client', clientId); }

  /* ---------------- PERGUNTAS (4 DIFERENTES CONJUNTOS) ---------------- */
  const QUESTION_SETS = {
    p1: [
      "What is your favorite book of all time, and why?",
      "Do you prefer physical books, e-books, or audiobooks? Why?",
      "If you could live inside any book, which one would you choose and why?"
    ],
    p2: [
      "Who is your favorite author and what makes their writing special?",
      "Do you have any reading rituals or a favorite place to read?",
      "What is the last book you read that you couldn't put down?"
    ],
    p3: [
      "Do you prefer fiction or non-fiction? Why?",
      "Have you ever read a book that changed your opinion about something?",
      "What book would you recommend to someone who doesn't like reading?"
    ],
    p4: [
      "What was your favorite book as a child?",
      "Do you prefer reading alone or discussing books with friends?",
      "If you could meet any character from a book, who would it be and why?"
    ]
  };

  /* ---------------- ESTADO ---------------- */
  const roomCode = 'reading_club'; // Fixed room
  let roomRef = null, mySlot = null, creatingGame = false;

  /* ---------------- LOGIN ---------------- */
  $('nameInput').value = localStorage.getItem('reading_name') || '';
  $('joinBtn').onclick = doJoin;
  $('nameInput').addEventListener('keydown', e => { if (e.key === 'Enter') doJoin(); });

  function showErr(m){ $('joinErr').textContent = m; }

  async function doJoin(){
    const name = $('nameInput').value.trim();
    if (!name) return showErr('Please enter your name.');
    showErr('');
    $('joinBtn').disabled = true;
    $('joinBtn').textContent = 'Connecting...';
    localStorage.setItem('reading_name', name);
    try {
      await joinRoom(name);
    } catch(e){
      console.error(e);
      showErr('Error connecting: ' + (e.message || e));
      $('joinBtn').disabled = false;
      $('joinBtn').textContent = 'Enter Room';
    }
  }

  async function joinRoom(name){
    roomRef = db.ref('rooms/' + roomCode);

    const res = await roomRef.child('players').transaction(players => {
      players = players || {};
      const keys = Object.keys(players).filter(k => players[k]);
      
      // Já estou na sala? (refresh)
      for (const k of keys){
        if (players[k].clientId === clientId){
          players[k].name = name;
          return players;
        }
      }
      
      // Limpar jogo antigo se a sala estiver vazia
      if (keys.length === 0) {
        roomRef.child('game').remove();
      }

      // Adicionar até 4 jogadores
      if (keys.length < 4){
        const newSlot = 'p' + (keys.length + 1);
        players[newSlot] = { name, clientId, joinedAt: Date.now() };
        return players;
      }
      
      return; // Sala cheia
    });

    if (!res.committed){
      showErr('This room is full (max 4 players).');
      $('joinBtn').disabled = false;
      $('joinBtn').textContent = 'Enter Room';
      return;
    }

    const players = res.snapshot.val();
    for (const k in players) {
      if (players[k] && players[k].clientId === clientId) {
        mySlot = k;
        break;
      }
    }

    $('joinCard').classList.add('hidden');
    $('game').classList.remove('hidden');

    roomRef.on('value', snap => {
      const room = snap.val();
      if (!room) return;
      const p = room.players || {};
      const keys = Object.keys(p).filter(k => p[k]);
      
      // Cria a estrutura de checkmarks assim que a primeira pessoa entra
      if (keys.length >= 1 && !room.game && !creatingGame){
        creatingGame = true;
        createGame().finally(() => { creatingGame = false; });
      }
      render(room);
    });
  }

  async function createGame(){
    const snap = await roomRef.child('players').once('value');
    const p = snap.val() || {};
    if (Object.keys(p).length < 1) return;
    
    await roomRef.child('game').transaction(g => {
      if (g) return g;
      return {
        checkmarks: {} // Inicializa os checkmarks
      };
    });
  }

  /* ---------------- RENDER ---------------- */
  function render(room){
    if (!room || !room.players) return;
    const players = room.players;
    const keys = Object.keys(players).filter(k => players[k]);
    
    // Atualiza a barra de jogadores (p1 & p2 & p3 ...)
    let barHtml = '';
    keys.forEach((k, index) => {
      const p = players[k];
      const isMe = k === mySlot;
      if (index > 0) barHtml += `<span class="ampersand">&</span>`;
      barHtml += `<div class="player-chip ${isMe ? 'me' : ''}"><span class="dot"></span>${esc(p.name)} ${isMe ? '<small>(you)</small>' : ''}</div>`;
    });
    $('playersBar').innerHTML = barHtml;

    // Renderiza o quadro de cada jogador (não precisa mais esperar por 2 jogadores)
    const checkmarks = (room.game && room.game.checkmarks) || {};
    let gridHtml = '';

    keys.forEach(k => {
      const p = players[k];
      const isMe = k === mySlot;
      const myChecks = checkmarks[k] || {};
      const qSet = QUESTION_SETS[k] || [];

      let cardsHtml = '';
      qSet.forEach((q, i) => {
        const qId = 'q' + i;
        const isChecked = myChecks[qId];
        cardsHtml += `
          <div class="q-card ${isChecked ? 'completed' : ''}" id="card_${k}_${qId}">
            <div class="q-content">
              <span class="q-tag">Question ${i+1}</span>
              <span class="q-text">${esc(q)}</span>
            </div>
            ${isMe ? `
            <button class="check-btn" onclick="toggleCheck('${qId}')" title="Mark as done">
              <svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"></polyline></svg>
            </button>` : ''}
          </div>`;
      });

      // 3 Blank slots (perguntas próprias)
      for(let i=1; i<=3; i++){
        const qId = 'custom' + i;
        const isChecked = myChecks[qId];
        cardsHtml += `
          <div class="q-card ${isChecked ? 'completed' : ''}" id="card_${k}_${qId}">
            <div class="q-content">
              <span class="q-tag">Your own question ${i}</span>
              <span class="q-text">(Ask this question out loud)</span>
            </div>
            ${isMe ? `
            <button class="check-btn" onclick="toggleCheck('${qId}')" title="Mark as done">
              <svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"></polyline></svg>
            </button>` : ''}
          </div>`;
      }

      gridHtml += `
        <div class="player-board ${isMe ? 'me' : ''}">
          <div class="board-header">
            <h3>${esc(p.name)}</h3>
            ${isMe ? '<span class="pill">Your Turn</span>' : '<span class="pill" style="background:var(--card2); color:var(--muted);">Listening</span>'}
          </div>
          <div class="q-grid">${cardsHtml}</div>
        </div>`;
    });

    $('boardsGrid').innerHTML = gridHtml;
  }

  /* ---------------- CHECKMARKS & CELEBRATION ---------------- */
  window.toggleCheck = async function(qId) {
    if (!roomRef || !mySlot) return;
    
    const ref = roomRef.child(`game/checkmarks/${mySlot}/${qId}`);
    const snap = await ref.once('value');
    const newValue = !snap.val();
    
    await ref.set(newValue);

    if (newValue) {
      triggerCelebration();
    }
  };

  function triggerCelebration() {
    const overlay = $('celebrationOverlay');
    const msg = $('celebrationMsg');
    
    // Mensagens aleatórias
    const msgs = ["Awesome! 🎉", "Great job! 🌟", "Mission Complete! 🚀", "Well done! 👏", "Keep going! 🔥"];
    msg.innerHTML = `<span>${msgs[Math.floor(Math.random() * msgs.length)]}</span>`;
    
    // Remove confetes antigos
    overlay.querySelectorAll('.confetti').forEach(el => el.remove());

    // Cria confetes
    for (let i = 0; i < 30; i++) {
      const confetti = document.createElement('div');
      confetti.className = 'confetti';
      confetti.style.left = Math.random() * 100 + 'vw';
      confetti.style.backgroundColor = ['#f59e0b', '#10b981', '#3b82f6', '#ef4444', '#8b5cf6'][Math.floor(Math.random() * 5)];
      confetti.style.animationDelay = Math.random() * 0.5 + 's';
      confetti.style.animationDuration = (Math.random() * 1 + 1) + 's';
      overlay.appendChild(confetti);
    }

    overlay.classList.add('show');
    setTimeout(() => {
      overlay.classList.remove('show');
    }, 1500);
  }

})();
</script>
</body>
</html>

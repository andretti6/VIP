<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Speaking Lab · Student</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  :root{
    --bg:#07090f; --panel:#121620; --panel2:#1a202e; --border:#2a3149;
    --text:#eef1f8; --muted:#8b93ad;
    --accent:#7c5cff; --accent2:#22d3ee;
    --green:#22c55e; --yellow:#eab308; --red:#ef4444;
  }
  html,body{height:100%;overflow:hidden}
  body{
    font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    background:var(--bg); color:var(--text);
    display:flex; justify-content:center; align-items:center;
  }
  .app-container{
    width:100%; max-width:900px; height:100vh;
    display:flex; flex-direction:column; padding:24px; gap:20px;
  }
  .image-container{
    position:relative; width:100%; flex:1;
    border-radius:20px; overflow:hidden;
    background:var(--panel); border:1px solid var(--border);
    min-height:250px;
    box-shadow:0 20px 50px -20px rgba(0,0,0,0.8);
  }
  .image-container img{
    width:100%; height:100%; object-fit:cover; display:block;
    transition:opacity 0.8s ease;
  }
  .image-overlay{
    position:absolute; inset:0;
    background:linear-gradient(180deg, transparent 40%, rgba(7,9,15,0.95) 100%);
  }
  .section-badge{
    position:absolute; top:20px; left:20px;
    background:rgba(7,9,15,.8); backdrop-filter:blur(8px);
    border:1px solid var(--border); padding:6px 16px; border-radius:100px;
    font-size:12px; font-weight:800; letter-spacing:2px; text-transform:uppercase;
    color:var(--accent2);
  }
  .question-container{
    background:var(--panel); border:1px solid var(--border);
    border-radius:20px; padding:30px;
    position:relative; min-height:140px;
    display:flex; align-items:center;
  }
  .question-text{
    font-size:clamp(20px, 3vw, 26px); font-weight:600; line-height:1.4;
    transition: opacity 0.5s, transform 0.5s, filter 0.5s;
  }
  .question-text.locked {
    opacity: 0; transform: translateY(20px); filter: blur(8px);
  }
  .question-text.unlocked {
    opacity: 1; transform: translateY(0); filter: blur(0);
  }
  .timer-container{
    background:var(--panel); border:1px solid var(--border);
    border-radius:20px; padding:20px 30px;
    display:flex; align-items:center; gap:20px;
  }
  .timer-phase{
    font-size:12px; font-weight:800; letter-spacing:2px; text-transform:uppercase;
    color:var(--muted); width:80px;
  }
  .timer-time{
    font-size:36px; font-weight:800; font-variant-numeric:tabular-nums;
    width:100px; text-align:right;
  }
  .timer-bar{
    flex:1; height:12px; background:var(--panel2);
    border-radius:100px; overflow:hidden; position:relative;
  }
  .timer-fill{
    position:absolute; top:0; left:0; bottom:0;
    transition: width 0.1s linear, background 0.3s;
    border-radius:100px;
    background:var(--green);
  }
  .phase-think { color:var(--yellow) !important; }
  .phase-talk { color:var(--green) !important; }
  .phase-done { color:var(--red) !important; }
  .fill-think { background:linear-gradient(90deg,var(--yellow),#facc15); }
  .fill-talk { background:linear-gradient(90deg,var(--green),#4ade80); }
  .fill-warn { background:linear-gradient(90deg,#f59e0b,var(--red)); }
  .fill-danger { background:linear-gradient(90deg,var(--red),#dc2626); }
  @media(max-width:600px){
    .timer-container{flex-wrap:wrap; justify-content:center;}
    .timer-bar{width:100%; order:3;}
    .question-container{padding:20px; min-height:100px;}
  }
</style>
</head>
<body>
<div class="app-container" id="studentApp">
  <div class="image-container">
    <img id="studentImage" src="" alt="Section Image" style="opacity:0;">
    <div class="image-overlay"></div>
    <div class="section-badge" id="studentBadge">Waiting…</div>
  </div>
  <div class="question-container">
    <div class="question-text locked" id="studentQuestion">Loading…</div>
  </div>
  <div class="timer-container">
    <div class="timer-phase" id="studentPhase">Wait</div>
    <div class="timer-time" id="studentTime">3:20</div>
    <div class="timer-bar">
      <div class="timer-fill" id="studentFill" style="width:100%"></div>
    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
<script>
(function(){
  'use strict';

  // ---- FIREBASE SETUP ----
  firebase.initializeApp({
    databaseURL: "https://english-meetings-f08e4-default-rtdb.firebaseio.com"
  });
  const db = firebase.database();
  const ROOM_ID = 'speakingLab'; // must match teacher.html

  // ---- DATA (must match teacher.html) ----
  const SECTIONS = [
    {
      badge: "Section 1 · Psychology",
      image: "https://lindastade.com/wp-content/uploads/2020/10/shutterstock_200319638.jpg",
      questions: [
        "Describe the scene and steps to both avoid it from happening and to remediate if it's happening.",
        "What are the psychological effects of social exclusion on teenagers?",
        "Have you ever witnessed or experienced bullying? How did it affect the school environment?",
        "How can teachers identify students who are being isolated?",
        "What role do parents play in preventing school violence?",
        "How does social media influence social hierarchies in schools?",
        "Is there a difference between physical bullying and emotional exclusion? Which is worse?",
        "How can schools create a culture of inclusion rather than competition?",
        "If you were a school principal, what is the first rule you would implement to stop bullying?"
      ]
    },
    {
      badge: "Section 2 · Science & Tech",
      image: "https://images.unsplash.com/photo-1485827404703-89b55fcc595e?auto=format&fit=crop&w=1200&q=80",
      questions: [
        "Talk about the Future of work and how we can get ready for it.",
        "What human skills will be most valuable when robots and AI take over repetitive tasks?",
        "Do you think AI will create more jobs than it destroys? Why?",
        "How can companies retrain their employees to work alongside AI?",
        "What ethical concerns arise from replacing human workers with robots?",
        "How do you feel about having an AI as a manager or colleague?",
        "What is the most important technological skill to learn right now?",
        "Could a machine ever truly replace the creativity of a human being?",
        "How should education systems change to prepare the next generation for this future?"
      ]
    },
    {
      badge: "Section 3 · Professional",
      image: "https://images.unsplash.com/photo-1522071820081-009f0129c71c?auto=format&fit=crop&w=1200&q=80",
      questions: [
        "What are the necessary steps to be fully engaged, satisfied and happy at work, getting along well with the team and growing in your career?",
        "What is the difference between a good manager and a bad manager?",
        "How do you handle conflict with a coworker you don't like?",
        "Is it possible to be happy at work if you don't love your job? How?",
        "What are the key factors for a team to function well together?",
        "How do you balance ambition and career growth with personal well-being?",
        "Describe a time you felt extremely motivated at work or school. What caused it?",
        "What does a healthy company culture look like to you?",
        "How can you tell if a company is the right fit for you during an interview?"
      ]
    }
  ];

  const TOTAL_SECONDS = 200; // 3:20
  const THINK_SECONDS = 20;

  // ---- DOM ----
  const $ = id => document.getElementById(id);
  const els = {
    image: $('studentImage'),
    badge: $('studentBadge'),
    qText: $('studentQuestion'),
    phase: $('studentPhase'),
    time: $('studentTime'),
    fill: $('studentFill')
  };

  let voiceOn = true;
  let lastQText = '';
  let lastSection = -1;
  let lastQ = -1;

  // ---- UTILS ----
  function fmt(s) {
    s = Math.max(0, Math.ceil(s));
    return Math.floor(s/60) + ':' + String(s%60).padStart(2,'0');
  }

  // ---- VOICE ----
  function speak(text) {
    if (!voiceOn || !('speechSynthesis' in window)) return;
    try {
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = 'en-US';
      u.rate = 0.95;
      const voices = window.speechSynthesis.getVoices();
      const preferred = voices.find(v => /en[-_]US/i.test(v.lang) && /google|samantha|aria/i.test(v.name))
        || voices.find(v => /en[-_]US/i.test(v.lang))
        || voices.find(v => /en/i.test(v.lang));
      if (preferred) u.voice = preferred;
      window.speechSynthesis.speak(u);
    } catch(e) {}
  }
  if ('speechSynthesis' in window) {
    window.speechSynthesis.getVoices();
    window.speechSynthesis.onvoiceschanged = () => window.speechSynthesis.getVoices();
  }

  // ---- RENDER ----
  function render(state) {
    if (!state) return;
    const { currentSection, currentQuestion, timeLeft, isRunning, voiceOn: v } = state;
    voiceOn = v !== false;

    const sec = SECTIONS[currentSection];
    if (!sec) return;

    // Image & badge
    els.badge.textContent = sec.badge;
    if (els.image.dataset.src !== sec.image) {
      els.image.style.opacity = '0';
      setTimeout(() => {
        els.image.src = sec.image;
        els.image.dataset.src = sec.image;
        els.image.onload = () => { els.image.style.opacity = '1'; };
      }, 200);
    }

    // Question text with locker effect
    const qText = sec.questions[currentQuestion];
    if (qText !== lastQText) {
      els.qText.classList.remove('unlocked');
      els.qText.classList.add('locked');
      setTimeout(() => {
        els.qText.textContent = qText;
        els.qText.classList.remove('locked');
        els.qText.classList.add('unlocked');
        speak(qText);
        lastQText = qText;
      }, 500);
    }

    // Timer
    const t = Math.max(0, timeLeft || 0);
    let phase = 'Wait';
    let cls = '';
    let timeStr = fmt(TOTAL_SECONDS);

    if (isRunning && t > 0) {
      if (t > TOTAL_SECONDS - THINK_SECONDS) {
        phase = 'Think'; cls = 'think';
        timeStr = Math.ceil(t - (TOTAL_SECONDS - THINK_SECONDS)) + 's';
      } else {
        phase = 'Talk'; cls = 'talk';
        timeStr = fmt(t);
      }
    } else if (t <= 0) {
      phase = 'Done'; cls = 'done'; timeStr = '0:00';
    } else {
      phase = 'Paused'; cls = ''; timeStr = fmt(t);
    }

    els.phase.textContent = phase;
    els.phase.className = 'timer-phase phase-' + cls;
    els.time.textContent = timeStr;
    els.time.className = 'timer-time phase-' + cls;
    els.fill.style.width = ((t / TOTAL_SECONDS) * 100) + '%';

    let fillCls = 'fill-talk';
    if (t <= 10) fillCls = 'fill-danger';
    else if (t <= 30) fillCls = 'fill-warn';
    else if (t > TOTAL_SECONDS - THINK_SECONDS) fillCls = 'fill-think';
    els.fill.className = 'timer-fill ' + fillCls;

    lastSection = currentSection;
    lastQ = currentQuestion;
  }

  // ---- FIREBASE LISTENER ----
  const stateRef = db.ref('rooms/' + ROOM_ID + '/state');
  stateRef.on('value', snap => {
    const state = snap.val();
    render(state);
  });

})();
</script>
</body>
</html>

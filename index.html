<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>B1 Teen Speak &amp; Dictate Activity</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',sans-serif;background:#eef3fa;background-image:radial-gradient(circle at 10% 4%,rgba(29,78,216,.09),transparent 40%),radial-gradient(circle at 90% 96%,rgba(15,118,110,.09),transparent 40%);background-attachment:fixed;color:#13202d;min-height:100vh;padding:24px 18px 48px}
.app{max-width:850px;margin:0 auto}
.hidden{display:none!important}

/* JOIN SCREEN */
.join-screen{max-width:440px;margin:60px auto 0;background:#fff;border-radius:28px;border:1px solid #e6eef6;box-shadow:0 24px 60px rgba(20,45,80,.14);padding:32px 30px 28px}
.join-brand{display:flex;align-items:center;gap:14px;margin-bottom:22px}
.join-logo{width:54px;height:54px;border-radius:17px;background:linear-gradient(135deg,#1d4ed8,#0f766e);color:#fff;display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0}
.join-brand h1{font-size:21px;font-weight:800;line-height:1.2}.join-brand h1 span{color:#1d4ed8}
.join-brand p{font-size:12.5px;color:#6b8299;font-weight:500;margin-top:3px}
.field label{display:block;font-size:10.5px;font-weight:800;letter-spacing:.8px;text-transform:uppercase;color:#7d92a8;margin-bottom:7px}
.field input{width:100%;padding:13px 15px;border-radius:13px;border:1.5px solid #dbe7f1;background:#f7fafd;font:600 15px 'Inter',sans-serif;color:#13202d;outline:none;margin-bottom:14px}
.field input:focus{border-color:#1d4ed8;background:#fff;box-shadow:0 0 0 4px #eaf1ff}

/* TOPBAR */
.topbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;background:#fff;border:1px solid #e6eef6;border-radius:20px;padding:14px 20px;box-shadow:0 10px 26px rgba(20,45,80,.08);margin-bottom:16px}
.brand-title{font-size:18px;font-weight:800;color:#1d4ed8;display:flex;align-items:center;gap:10px}
.me-chip{display:flex;align-items:center;gap:8px;padding:6px 14px;border-radius:30px;font-size:13px;font-weight:700}
.me-chip.student{background:#eaf1ff;color:#1d4ed8}
.me-chip.ghost{background:#f1ebff;color:#7c3aed}
.score-chip{background:#fff4e0;border:1.5px solid #f0c88a;border-radius:30px;padding:6px 16px;font-size:13px;font-weight:800;color:#b45309;display:flex;align-items:center;gap:7px}

.location-banner{display:flex;align-items:center;justify-content:space-between;gap:12px;background:linear-gradient(135deg,#1d4ed8,#16389b);color:#fff;border-radius:16px;padding:14px 20px;margin-bottom:22px;box-shadow:0 12px 28px rgba(29,78,216,.28)}
.loc-info{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:700}.loc-info i{color:#ffd166}
.loc-step-num{background:rgba(255,255,255,.2);padding:4px 12px;border-radius:30px;font-size:12px;font-weight:800}

/* CONTROL PANELS */
.control-panel{background:#f8fafc;border:1.5px dashed #cbd5e1;border-radius:16px;padding:14px 18px;margin-bottom:16px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.control-panel.teacher{background:#f1ebff;border-color:#d6c7f5}

.section{background:#fff;border:1px solid #e6eef6;border-radius:26px;box-shadow:0 16px 38px rgba(20,45,80,.09);overflow:hidden}
.section-head{padding:20px 26px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;border-bottom:1px solid #eaf1f8}
.section-head.l{background:linear-gradient(135deg,#f1ebff,#eaf1ff)}
.sec-badge{display:inline-flex;align-items:center;gap:7px;background:#eaf1ff;color:#1d4ed8;padding:5px 14px;border-radius:30px;font-size:11px;font-weight:800;letter-spacing:.7px;text-transform:uppercase}
.sec-badge.listen{background:#fff;color:#7c3aed}
.sec-title{font-size:20px;font-weight:800}
.section-body{padding:26px}

/* SPEAKING SINGLE TOPIC CAROUSEL */
.topic-carousel{display:flex;flex-direction:column;align-items:center}
.topic-nav-controls{display:flex;align-items:center;justify-content:space-between;width:100%;margin-bottom:18px}
.topic-counter{font-size:13px;font-weight:800;color:#6b8299;background:#f2f7fc;padding:6px 14px;border-radius:30px}
.pic-card{background:var(--tint);border:3px solid var(--accent);border-radius:24px;padding:36px 28px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:18px;box-shadow:0 18px 36px rgba(20,45,80,.14);width:100%;max-width:550px;transition:all .3s ease}
.pic-icon{width:120px;height:120px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 10px 26px rgba(20,45,80,.15);color:var(--accent);font-size:52px}
.pic-card h3{font-size:24px;font-weight:800;color:#13202d}
.pic-card p{font-size:15px;font-weight:500;color:#4a6580;line-height:1.55;max-width:440px}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:6px}
.chip{background:#fff;border:1.5px solid #dbe7f1;color:#2c4359;font-size:13px;font-weight:700;padding:6px 14px;border-radius:40px}
.timer-display{font-size:32px;font-weight:800;letter-spacing:1px;color:#1d4ed8;font-variant-numeric:tabular-nums}

/* AUDIO PLAYER CONTAINER */
.audio-box{background:#f1ebff;border:1.5px solid #d6c7f5;border-radius:16px;padding:16px 20px;margin-bottom:20px}
.audio-box label{display:block;font-size:11px;font-weight:800;text-transform:uppercase;color:#7c3aed;margin-bottom:8px;letter-spacing:.8px}
audio{width:100%;border-radius:10px}

/* QUESTIONS */
.q-card{background:#fff;border:1.5px solid #e2ecf5;border-radius:16px;padding:18px;margin-bottom:14px;transition:all .2s}
.q-card.solved{border-color:#16a34a;background:linear-gradient(180deg,#f3fdf7,#eafaf1)}
.q-head{display:flex;align-items:flex-start;gap:12px;margin-bottom:12px}
.q-num{width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;flex-shrink:0;background:#eaf1ff;color:#1d4ed8}
.q-text{flex:1;font-size:14.5px;font-weight:700;color:#1c3350;line-height:1.45}
.options{display:flex;flex-direction:column;gap:8px}
.opt{width:100%;text-align:left;border:1.5px solid #dbe7f1;background:#fbfdff;border-radius:12px;padding:12px 14px;display:flex;align-items:center;gap:10px;font:600 13.5px 'Inter',sans-serif;color:#33526e;cursor:pointer;transition:.15s}
.opt .l{width:24px;height:24px;border-radius:6px;background:#eef3f9;color:#4a6580;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;flex-shrink:0}
.opt:hover:not(:disabled){border-color:#1d4ed8;background:#f4f9ff}
.opt.correct{background:#eafaf1;border-color:#16a34a;color:#14603c}.opt.correct .l{background:#16a34a;color:#fff}
.opt.wrong{background:#fdeaea;border-color:#dc2626;color:#8f2f2f}.opt.wrong .l{background:#dc2626;color:#fff}
.opt:disabled{cursor:default}.opt:disabled:not(.correct):not(.wrong){opacity:.6}

/* BUTTONS & NAV */
.btn{border:none;border-radius:40px;padding:12px 24px;font:800 14px 'Inter',sans-serif;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:9px;background:linear-gradient(135deg,#1d4ed8,#16389b);color:#fff;box-shadow:0 8px 20px rgba(29,78,216,.3);transition:.18s}
.btn:hover:not(:disabled){transform:translateY(-2px)}.btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
.btn.soft{background:#eef3f9;color:#3d5a75;box-shadow:none}.btn.soft:hover:not(:disabled){background:#dbe7f1}
.btn.gold{background:#ffd166;color:#7a4a00;box-shadow:0 8px 20px rgba(255,209,102,.3)}
.step-nav{display:flex;align-items:center;justify-content:center;gap:14px;background:#fff;border:1px solid #e6eef6;border-radius:20px;padding:14px 20px;box-shadow:0 10px 26px rgba(20,45,80,.08);margin-top:22px}
.step-dots{display:flex;gap:8px}
.step-dot{width:32px;height:32px;border-radius:50%;border:2px solid #dbe7f1;background:#fff;color:#6b8299;font:800 12px 'Inter',sans-serif;cursor:pointer;display:flex;align-items:center;justify-content:center}
.step-dot.active{background:#1d4ed8;border-color:#1d4ed8;color:#fff;width:40px;border-radius:18px}
.toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:#16a34a;color:#fff;padding:12px 24px;border-radius:40px;font-size:14px;font-weight:700;box-shadow:0 12px 30px rgba(22,163,74,.35);z-index:1000}
</style>
</head>
<body>

<!-- JOIN SCREEN -->
<div class="join-screen" id="joinScreen">
  <div class="join-brand">
    <div class="join-logo"><i class="fas fa-comments"></i></div>
    <div><h1>Speak &amp; Dictate <span>Activity</span></h1><p>B1 Teen Practice Module</p></div>
  </div>
  <div class="field">
    <label for="nameInput">Your Name</label>
    <input id="nameInput" type="text" maxlength="24" placeholder="Type your name..." autocomplete="off" />
  </div>
  <button type="button" class="btn" style="width:100%" id="joinBtn"><i class="fas fa-arrow-right-to-bracket"></i> Enter Activity</button>
</div>

<!-- MAIN APP -->
<div class="app hidden" id="mainApp">
  <div class="topbar">
    <div class="brand-title"><i class="fas fa-comment-dots"></i> Speak &amp; Dictate</div>
    <div class="me-chip student" id="meChip"><span id="meName">Student</span></div>
    <div class="score-chip"><i class="fas fa-trophy"></i> <span id="scoreDisplay">0</span> Points</div>
  </div>

  <div class="location-banner">
    <div class="loc-info">
      <i class="fas fa-compass"></i>
      <span class="loc-step-num" id="locNum">Page 1 / 4</span>
      <span id="locTitle">Speaking Practice 1</span>
    </div>
    <button type="button" class="btn gold hidden" id="sendStudentBtn"><i class="fas fa-paper-plane"></i> Send Student Here</button>
  </div>

  <div id="sectionContainer"></div>

  <nav class="step-nav">
    <button class="btn soft hidden" id="prevBtn"><i class="fas fa-arrow-left"></i> Back</button>
    <div class="step-dots" id="stepDots"></div>
    <button class="btn hidden" id="nextBtn">Next <i class="fas fa-arrow-right"></i></button>
  </nav>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script>
(function () {
'use strict';

const FIREBASE_URL = 'https://english-meetings-f08e4-default-rtdb.firebaseio.com';
const ROOM = 'B1_TEEN_SINGLE_ACTIVITY';
const GHOSTS = ['andre prof','prof andre','andre professor','professor andre','prof. andre','andre prof.'];

const PAGES = [
  {
    type: 'speak',
    title: 'Page 1 · Speaking Practice (Set 1)',
    topics: [
      { n: 'Technology & Gadgets', i: 'fa-mobile-screen-button', d: 'Talk about your favorite device, how often you use it, and what apps you like most.', c: ['screen time', 'social media', 'video games', 'apps'], color: ['#1d4ed8', '#eaf1ff'] },
      { n: 'Hobbies & Free Time', i: 'fa-gamepad', d: 'Describe what you enjoy doing on weekends, who you do it with, and why you find it fun.', c: ['sports', 'drawing', 'hanging out', 'relaxing'], color: ['#0f766e', '#e3f5f2'] },
      { n: 'Travel & Holidays', i: 'fa-plane-departure', d: 'Talk about a memorable trip you took or a destination you would love to visit in the future.', c: ['sightseeing', 'hotel', 'packing', 'flight'], color: ['#b45309', '#fff4e0'] }
    ]
  },
  {
    type: 'dict',
    title: 'Page 2 · Listening Dictation 1',
    audio: 'https://files.catbox.moe/luvtjc.mp3',
    audioTitle: 'The Smartphone Fast',
    questions: [
      { q: "How old is Leo?", opts: ["14 years old", "15 years old", "16 years old"], ans: 1 },
      { q: "What time did he turn off his phone every evening?", opts: ["After 7 PM", "After 8 PM", "After 9 PM"], ans: 0 },
      { q: "Why did his school grades improve?", opts: ["He bought new books", "He studied with friends", "He finished homework faster without phone alerts"], ans: 2 },
      { q: "Where does Leo keep his phone now when studying?", opts: ["In his backpack", "In another room", "Under his pillow"], ans: 1 }
    ]
  },
  {
    type: 'speak',
    title: 'Page 3 · Speaking Practice (Set 2)',
    topics: [
      { n: 'The Environment', i: 'fa-seedling', d: 'Explain what young people can do to help nature and protect the planet.', c: ['recycling', 'saving water', 'plastic waste', 'clean up'], color: ['#16a34a', '#eafaf1'] },
      { n: 'School Life & Subjects', i: 'fa-graduation-cap', d: 'Talk about your favorite subject at school, your teachers, and what you want to study later.', c: ['exams', 'classmates', 'break time', 'project'], color: ['#7c3aed', '#f1ebff'] },
      { n: 'Music & Movies', i: 'fa-film', d: 'Discuss your favorite music band or movie genre, and why you recommend it.', c: ['playlist', 'cinema', 'soundtrack', 'actors'], color: ['#dc2626', '#fdeaea'] }
    ]
  },
  {
    type: 'dict',
    title: 'Page 4 · Listening Dictation 2',
    audio: 'https://files.catbox.moe/848g7y.mp3',
    audioTitle: 'The Eco-Friendly School',
    questions: [
      { q: "Where is the high school located?", opts: ["London", "Manchester", "Liverpool"], ans: 1 },
      { q: "How many plastic bottles did the students collect in one month?", opts: ["Over 1,000", "Over 2,000", "Over 5,000"], ans: 1 },
      { q: "What did the school buy with the recycling money?", opts: ["10 new bicycles", "New computers", "Sports equipment"], ans: 0 },
      { q: "According to the headteacher, what can make a huge difference?", opts: ["Longer holidays", "Higher taxes", "Small changes in daily habits"], ans: 2 }
    ]
  }
];

let isGhost = false;
let userName = '';
let currentPage = 0;
let topicIndices = { 0: 0, 2: 0 };
let userAnswers = {};
let score = 0;
let db = null, fbOk = false;
let timerInterval = null, timerEndsAt = 0;

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function toast(msg) {
  const el = document.createElement('div');
  el.className = 'toast';
  el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 2500);
}

function initFirebase() {
  if (typeof firebase === 'undefined' || !firebase.initializeApp) return;
  try {
    firebase.initializeApp({ databaseURL: FIREBASE_URL });
    db = firebase.database();
    fbOk = true;
  } catch (e) { console.warn(e); }
}

$('joinBtn').addEventListener('click', () => {
  const name = $('nameInput').value.trim();
  if (!name) return;
  userName = name;
  const clean = name.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').trim();
  isGhost = GHOSTS.includes(clean);

  $('joinScreen').classList.add('hidden');
  $('mainApp').classList.remove('hidden');
  $('meName').textContent = isGhost ? '👻 Andre Prof (Teacher)' : userName;
  $('meChip').className = 'me-chip ' + (isGhost ? 'ghost' : 'student');

  if (isGhost) {
    $('sendStudentBtn').classList.remove('hidden');
    $('prevBtn').classList.remove('hidden');
    $('nextBtn').classList.remove('hidden');
  }

  listenSync();
  render();
});

function listenSync() {
  if (!fbOk) return;
  db.ref('rooms/' + ROOM).on('value', snap => {
    const data = snap.val() || {};
    if (!isGhost && data.currentPage !== undefined) {
      currentPage = data.currentPage;
    }
    if (data.topicIndices) {
      topicIndices = data.topicIndices;
    }
    if (data.timerEndsAt) {
      timerEndsAt = data.timerEndsAt;
      startTimerCountdown();
    }
    render();
  });
}

function syncState() {
  if (fbOk && isGhost) {
    db.ref('rooms/' + ROOM).update({
      currentPage,
      topicIndices
    });
  }
}

function startTimerCountdown() {
  clearInterval(timerInterval);
  timerInterval = setInterval(() => {
    const rem = Math.max(0, Math.ceil((timerEndsAt - Date.now()) / 1000));
    const timerEl = $('timerDisplay');
    if (timerEl) {
      const mins = Math.floor(rem / 60);
      const secs = String(rem % 60).padStart(2, '0');
      timerEl.textContent = `${mins}:${secs}`;
    }
    if (rem <= 0) clearInterval(timerInterval);
  }, 500);
}

function render() {
  const page = PAGES[currentPage];
  $('locNum').textContent = `Page ${currentPage + 1} / ${PAGES.length}`;
  $('locTitle').textContent = page.title;

  $('stepDots').innerHTML = PAGES.map((_, i) => 
    `<button class="step-dot ${i === currentPage ? 'active' : ''}" data-page="${i}" ${!isGhost ? 'style="pointer-events:none;"' : ''}>${i + 1}</button>`
  ).join('');

  if (isGhost) {
    $('prevBtn').disabled = currentPage === 0;
    $('nextBtn').disabled = currentPage === PAGES.length - 1;
  }

  if (page.type === 'speak') {
    renderSpeaking(page);
  } else {
    renderDictation(page);
  }
}

function renderSpeaking(page) {
  const tIdx = topicIndices[currentPage];
  const topic = page.topics[tIdx];

  const teacherControls = isGhost ? `
    <div class="control-panel teacher">
      <span><strong>Teacher Controls:</strong> Timer & Topics</span>
      <button class="btn gold" id="startTimerBtn"><i class="fas fa-stopwatch"></i> Start 5-Min Timer</button>
    </div>
  ` : '';

  $('sectionContainer').innerHTML = `
    ${teacherControls}
    <div class="section">
      <div class="section-head">
        <span class="sec-badge"><i class="fas fa-comments"></i> Speaking</span>
        <span class="sec-title">${esc(page.title)}</span>
        <span class="timer-display" id="timerDisplay" style="margin-left:auto;">5:00</span>
      </div>
      <div class="section-body topic-carousel">
        <div class="topic-nav-controls">
          <button class="btn soft" id="prevTopicBtn" ${tIdx === 0 || !isGhost ? 'disabled' : ''}><i class="fas fa-chevron-left"></i> Topic ${tIdx}</button>
          <span class="topic-counter">Topic ${tIdx + 1} of ${page.topics.length}</span>
          <button class="btn soft" id="nextTopicBtn" ${tIdx === page.topics.length - 1 || !isGhost ? 'disabled' : ''}>Topic ${tIdx + 2} <i class="fas fa-chevron-right"></i></button>
        </div>
        <div class="pic-card" style="--accent:${topic.color[0]}; --tint:${topic.color[1]}">
          <div class="pic-icon"><i class="fas ${topic.i}"></i></div>
          <h3>${esc(topic.n)}</h3>
          <p>${esc(topic.d)}</p>
          <div class="chips">
            ${topic.c.map(keyword => `<span class="chip">${esc(keyword)}</span>`).join('')}
          </div>
        </div>
      </div>
    </div>
  `;

  if (isGhost) {
    $('prevTopicBtn').addEventListener('click', () => { if (topicIndices[currentPage] > 0) { topicIndices[currentPage]--; syncState(); render(); } });
    $('nextTopicBtn').addEventListener('click', () => { if (topicIndices[currentPage] < page.topics.length - 1) { topicIndices[currentPage]++; syncState(); render(); } });
    $('startTimerBtn').addEventListener('click', () => {
      timerEndsAt = Date.now() + 5 * 60 * 1000;
      if (fbOk) db.ref('rooms/' + ROOM).update({ timerEndsAt });
      startTimerCountdown();
    });
  }
}

function renderDictation(page) {
  // Play button & Audio Player ONLY shown for Andre Prof (isGhost)
  const audioBlock = isGhost ? `
    <div class="audio-box">
      <label><i class="fas fa-lock"></i> Teacher Audio Player (${page.audioTitle})</label>
      <audio controls src="${page.audio}"></audio>
    </div>
  ` : '';

  const qHtml = page.questions.map((q, idx) => {
    const qKey = `${currentPage}_${idx}`;
    const ansState = userAnswers[qKey];
    const isSolved = ansState && ansState.correct;

    return `
      <div class="q-card ${isSolved ? 'solved' : ''}">
        <div class="q-head">
          <span class="q-num">${idx + 1}</span>
          <p class="q-text">${esc(q.q)}</p>
        </div>
        <div class="options">
          ${q.opts.map((opt, oIdx) => {
            let cls = '';
            if (ansState && ansState.choice === oIdx) {
              cls = ansState.correct ? 'correct' : 'wrong';
            }
            return `
              <button class="opt ${cls}" data-q="${qKey}" data-opt="${oIdx}" ${isSolved || isGhost ? 'disabled' : ''}>
                <span class="l">${['A','B','C'][oIdx]}</span>
                <span>${esc(opt)}</span>
              </button>
            `;
          }).join('')}
        </div>
      </div>
    `;
  }).join('');

  $('sectionContainer').innerHTML = `
    <div class="section">
      <div class="section-head l">
        <span class="sec-badge listen"><i class="fas fa-headphones"></i> Listening Dictation</span>
        <span class="sec-title">${esc(page.title)}</span>
      </div>
      <div class="section-body">
        ${audioBlock}
        <p style="font-size:14px; color:#55708b; margin-bottom:18px; font-weight:600;">
          ${isGhost ? 'Listen to the audio above and guide the student.' : 'Listen carefully to the passage and answer the questions:'}
        </p>
        ${qHtml}
      </div>
    </div>
  `;
}

$('sectionContainer').addEventListener('click', e => {
  const optBtn = e.target.closest('.opt');
  if (!optBtn || optBtn.disabled || isGhost) return;

  const [pIdx, qIdx] = optBtn.dataset.q.split('_').map(Number);
  const selectedOpt = Number(optBtn.dataset.opt);
  const qData = PAGES[pIdx].questions[qIdx];
  const isCorrect = selectedOpt === qData.ans;

  if (isCorrect) {
    userAnswers[optBtn.dataset.q] = { choice: selectedOpt, correct: true };
    score += 10;
    $('scoreDisplay').textContent = score;
    toast('🎉 Correct! +10 points');
  } else {
    userAnswers[optBtn.dataset.q] = { choice: selectedOpt, correct: false };
    toast('❌ Try again!');
  }
  render();
});

$('sendStudentBtn').addEventListener('click', () => {
  if (isGhost && fbOk) {
    db.ref('rooms/' + ROOM).update({ currentPage });
    toast('📤 Student guided to Page ' + (currentPage + 1));
  }
});

$('prevBtn').addEventListener('click', () => { if (isGhost && currentPage > 0) { currentPage--; syncState(); render(); } });
$('nextBtn').addEventListener('click', () => { if (isGhost && currentPage < PAGES.length - 1) { currentPage++; syncState(); render(); } });
$('stepDots').addEventListener('click', e => {
  const dot = e.target.closest('.step-dot');
  if (dot && isGhost) { currentPage = Number(dot.dataset.page); syncState(); render(); }
});

initFirebase();
})();
</script>
</body>
</html>

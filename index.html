<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Workplace Scenarios — Mystery Cards</title>
<style>
  :root{
    --bg1:#0f172a;
    --bg2:#1e293b;
    --ink:#0f172a;
    --muted:#475569;
    --radius:18px;
  }

  *{box-sizing:border-box;}

  body{
    margin:0;
    min-height:100vh;
    padding:40px 18px 70px;
    font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;
    color:var(--ink);
    background:linear-gradient(160deg,var(--bg1),var(--bg2));
  }

  header{
    max-width:1000px;
    margin:0 auto 26px;
    text-align:center;
    color:#e2e8f0;
  }
  header h1{
    margin:0 0 10px;
    font-size:clamp(1.5rem,4vw,2.2rem);
    letter-spacing:-.02em;
  }
  header p{
    margin:0;
    color:#94a3b8;
    font-size:.98rem;
    line-height:1.5;
  }

  .toolbar{
    display:flex;
    justify-content:center;
    gap:12px;
    flex-wrap:wrap;
    margin:20px 0 0;
  }
  .toolbar button{
    border:1px solid rgba(226,232,240,.25);
    background:rgba(226,232,240,.08);
    color:#e2e8f0;
    padding:9px 18px;
    border-radius:999px;
    font-size:.85rem;
    cursor:pointer;
    transition:.2s;
    font-weight:500;
  }
  .toolbar button:hover{background:rgba(226,232,240,.18);}
  #resetBtn{border-color:rgba(248,113,113,.5);color:#fecaca;}
  #resetBtn:hover{background:rgba(248,113,113,.15);}

  /* ============ CARD GRID ============ */
  .grid{
    max-width:1000px;
    margin:32px auto 0;
    display:grid;
    gap:18px;
    grid-template-columns:repeat(auto-fit,minmax(240px,1fr));
  }

  .card{
    position:relative;
    min-height:260px;
    border:0;
    padding:0;
    background:none;
    font:inherit;
    text-align:left;
    cursor:pointer;
    border-radius:var(--radius);
    transition:transform .25s ease, box-shadow .25s ease;
  }
  .card:hover{transform:translateY(-4px);}
  .card:focus-visible{outline:3px solid #38bdf8;outline-offset:4px;}

  .front{
    position:relative;
    width:100%;
    height:100%;
    min-height:260px;
    border-radius:var(--radius);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    color:#fff;
    background:linear-gradient(135deg,var(--c1),var(--c2));
    box-shadow:0 12px 28px rgba(2,6,23,.32);
    overflow:hidden;
  }
  .front::after{
    content:"";
    position:absolute;
    inset:0;
    background:radial-gradient(circle at 78% 15%,rgba(255,255,255,.35),transparent 55%);
    pointer-events:none;
  }

  .number{
    position:absolute;
    top:12px;
    left:12px;
    min-width:34px;
    height:34px;
    padding:0 9px;
    border-radius:999px;
    background:rgba(255,255,255,.22);
    border:1px solid rgba(255,255,255,.5);
    display:grid;
    place-items:center;
    font-weight:800;
    font-size:1rem;
    backdrop-filter:blur(4px);
    z-index:2;
  }

  .check-box{
    position:absolute;
    top:14px;
    right:14px;
    width:28px;
    height:28px;
    border-radius:8px;
    border:2px solid rgba(255,255,255,.7);
    background:rgba(255,255,255,.2);
    color:#fff;
    font-size:1rem;
    font-weight:700;
    display:grid;
    place-items:center;
    cursor:pointer;
    transition:all .2s ease;
    user-select:none;
    z-index:3;
  }
  .check-box:hover{background:rgba(255,255,255,.4);}
  .card.done .check-box{background:#22c55e;border-color:#22c55e;}

  .question-mark{
    font-size:clamp(3.2rem,10vw,4.6rem);
    font-weight:800;
    line-height:1;
    text-shadow:0 6px 18px rgba(0,0,0,.25);
    animation:breathe 3.4s ease-in-out infinite;
  }
  @keyframes breathe{
    0%,100%{transform:scale(1);}
    50%{transform:scale(1.07);}
  }
  .hint{
    position:absolute;
    bottom:14px;
    font-size:.74rem;
    letter-spacing:.09em;
    text-transform:uppercase;
    opacity:.85;
  }

  .card.done .front{filter:grayscale(.45) brightness(.9);}
  .card.done .front::before{
    content:"✅";
    position:absolute;
    bottom:12px;
    right:14px;
    font-size:1.4rem;
    z-index:2;
    filter:drop-shadow(0 2px 4px rgba(0,0,0,.3));
  }

  .card:nth-child(1){--c1:#6366f1;--c2:#0ea5e9;}
  .card:nth-child(2){--c1:#ec4899;--c2:#f97316;}
  .card:nth-child(3){--c1:#0f766e;--c2:#22c55e;}
  .card:nth-child(4){--c1:#b45309;--c2:#facc15;}
  .card:nth-child(5){--c1:#7c3aed;--c2:#a855f7;}

  /* ============ MODAL ============ */
  .modal-overlay{
    position:fixed;
    inset:0;
    background:rgba(15,23,42,.78);
    backdrop-filter:blur(7px);
    -webkit-backdrop-filter:blur(7px);
    display:none;
    align-items:flex-start;
    justify-content:center;
    padding:30px 16px 50px;
    z-index:100;
    overflow-y:auto;
  }
  .modal-overlay.open{display:flex;}

  .modal{
    background:#fff;
    border-radius:22px;
    max-width:1020px;
    width:100%;
    margin:auto;
    overflow:hidden;
    box-shadow:0 30px 80px rgba(0,0,0,.55);
    animation:pop .38s cubic-bezier(.2,.9,.3,1.15);
    position:relative;
  }
  @keyframes pop{
    from{transform:scale(.94) translateY(14px);opacity:0;}
    to{transform:scale(1) translateY(0);opacity:1;}
  }

  .modal-head{
    position:relative;
    padding:22px 26px;
    color:#fff;
    background:linear-gradient(135deg,var(--mc1),var(--mc2));
    overflow:hidden;
  }
  .modal-head::after{
    content:"";
    position:absolute;
    inset:0;
    background:radial-gradient(circle at 85% 10%,rgba(255,255,255,.3),transparent 55%);
    pointer-events:none;
  }
  .modal-head .num{
    display:inline-grid;
    place-items:center;
    min-width:30px;
    height:30px;
    padding:0 8px;
    border-radius:999px;
    background:rgba(255,255,255,.25);
    border:1px solid rgba(255,255,255,.5);
    font-weight:800;
    font-size:.85rem;
    margin-right:10px;
    vertical-align:middle;
  }
  .modal-head h2{
    margin:0;
    font-size:clamp(1.15rem,2.6vw,1.5rem);
    display:inline-block;
    vertical-align:middle;
    letter-spacing:-.01em;
  }
  .modal-head .sub{
    margin:8px 0 0;
    font-size:.9rem;
    opacity:.92;
    line-height:1.5;
    max-width:820px;
    position:relative;
    z-index:1;
  }
  .close-btn{
    position:absolute;
    top:16px;
    right:16px;
    width:36px;
    height:36px;
    border-radius:50%;
    border:1px solid rgba(255,255,255,.5);
    background:rgba(255,255,255,.2);
    color:#fff;
    font-size:1.2rem;
    font-weight:700;
    cursor:pointer;
    display:grid;
    place-items:center;
    transition:.2s;
    z-index:5;
  }
  .close-btn:hover{background:rgba(255,255,255,.4);transform:rotate(90deg);}

  .modal-body{
    padding:22px 26px 28px;
  }

  .section-title{
    font-size:.7rem;
    font-weight:800;
    letter-spacing:.1em;
    text-transform:uppercase;
    color:#94a3b8;
    margin:0 0 10px;
  }

  /* ---- Stats grid ---- */
  .stats{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(140px,1fr));
    gap:9px;
    margin-bottom:24px;
  }
  .stat{
    background:#f8fafc;
    border:1px solid #e2e8f0;
    border-radius:12px;
    padding:9px 12px;
    display:flex;
    flex-direction:column;
    gap:2px;
  }
  .stat .lbl{
    font-size:.66rem;
    text-transform:uppercase;
    letter-spacing:.06em;
    color:#94a3b8;
    font-weight:700;
  }
  .stat .val{
    font-size:.92rem;
    font-weight:800;
    color:var(--ink);
    line-height:1.2;
  }

  /* ---- Charts grid ---- */
  .charts{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(240px,1fr));
    gap:14px;
    margin-bottom:24px;
  }
  .chart-card{
    background:#f8fafc;
    border:1px solid #e2e8f0;
    border-radius:16px;
    padding:12px 14px 14px;
  }
  .chart-card h4{
    margin:0 0 10px;
    font-size:.72rem;
    font-weight:800;
    letter-spacing:.05em;
    text-transform:uppercase;
    color:#64748b;
  }

  .donut-wrap{
    display:flex;
    align-items:center;
    gap:14px;
    flex-wrap:wrap;
    justify-content:center;
  }
  .legend{
    display:flex;
    flex-direction:column;
    gap:6px;
    font-size:.78rem;
    color:var(--muted);
  }
  .lg-item{
    display:flex;
    align-items:center;
    gap:6px;
    white-space:nowrap;
  }
  .lg-item i{
    width:11px;
    height:11px;
    border-radius:3px;
    display:inline-block;
    flex:0 0 auto;
  }
  .lg-item b{color:var(--ink);margin-left:2px;}

  /* ---- Two column bottom ---- */
  .bottom-cols{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:18px;
  }
  @media (max-width:640px){
    .bottom-cols{grid-template-columns:1fr;}
  }

  .panel{
    background:#f8fafc;
    border:1px solid #e2e8f0;
    border-radius:16px;
    padding:14px 16px;
  }
  .panel h3{
    margin:0 0 10px;
    font-size:.72rem;
    font-weight:800;
    letter-spacing:.08em;
    text-transform:uppercase;
    color:var(--mc1);
  }

  .mission{
    list-style:none;
    padding:0;
    margin:0;
  }
  .mission li{
    position:relative;
    padding-left:17px;
    margin-bottom:6px;
    font-size:.86rem;
    line-height:1.45;
    color:#334155;
  }
  .mission li::before{
    content:"→";
    position:absolute;
    left:0;
    color:var(--mc1);
    font-weight:800;
  }

  .cues{
    list-style:none;
    padding:0;
    margin:0;
  }
  .cues li{
    border-left:3px solid var(--mc2);
    padding:3px 0 3px 10px;
    margin-bottom:7px;
    font-size:.84rem;
    font-style:italic;
    line-height:1.4;
    color:#334155;
  }

  @media (max-width:520px){
    .modal-head{padding:18px 18px;}
    .modal-body{padding:18px 16px 22px;}
    .close-btn{top:12px;right:12px;width:32px;height:32px;}
  }
</style>
</head>
<body>

<header>
  <h1>Workplace Scenarios — Mystery Cards</h1>
  <p>Pick a number and say it out loud. Tap the card to open the full situation with charts, your mission, and useful phrases.</p>
  <div class="toolbar">
    <button id="soundToggle" aria-pressed="true">🔊 Sound on</button>
    <button id="resetBtn">🔄 Reset game</button>
  </div>
</header>

<main class="grid" id="grid"></main>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"></div>
</div>

<script>
/* =========================================================
   SVG CHART BUILDERS
   ========================================================= */
let _uid = 0;

function areaChart(values, color){
  const w=200,h=100,n=values.length,step=w/(n-1);
  const id='grad'+(++_uid);
  const c=values.map((v,i)=>[+(i*step).toFixed(1), +(h-v).toFixed(1)]);
  let d=`M${c[0][0]},${c[0][1]}`;
  for(let i=1;i<n;i++) d+=` L${c[i][0]},${c[i][1]}`;
  d+=` L${w},${h} L0,${h} Z`;

  const grids=[25,50,75].map(y=>`<line x1="0" y1="${y}" x2="${w}" y2="${y}" stroke="#e2e8f0" stroke-width=".6"/>`).join('');

  return `<svg viewBox="0 0 200 100" preserveAspectRatio="none" style="width:100%;height:120px;display:block">
    <defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="${color}" stop-opacity=".95"/>
      <stop offset="100%" stop-color="${color}" stop-opacity=".28"/>
    </linearGradient></defs>
    ${grids}
    <path d="${d}" fill="url(#${id})"/>
    <path d="${d}" fill="none" stroke="${color}" stroke-width="1.4" opacity=".65"/>
  </svg>`;
}

function barChart(values, colors){
  const w=200,h=100,n=values.length,gap=6;
  const bw=(w-gap*(n+1))/n;
  const max=Math.max(...values,1);
  const grids=[25,50,75].map(y=>`<line x1="0" y1="${y}" x2="${w}" y2="${y}" stroke="#e2e8f0" stroke-width=".6"/>`).join('');
  let out='';
  values.forEach((v,i)=>{
    const bh=Math.max((v/max)*88, 2);
    const x=gap+i*(bw+gap);
    out+=`<rect x="${x.toFixed(1)}" y="${(h-bh).toFixed(1)}" width="${bw.toFixed(1)}" height="${bh.toFixed(1)}" rx="3" fill="${colors[i%colors.length]}"/>`;
  });
  return `<svg viewBox="0 0 200 100" preserveAspectRatio="none" style="width:100%;height:120px;display:block">${grids}${out}</svg>`;
}

function lineDots(values, lineColor, dotColor){
  const w=200,h=100,n=values.length,step=w/(n-1);
  const pts=values.map((v,i)=>`${(i*step).toFixed(1)},${(h-v).toFixed(1)}`).join(' ');
  let dots='';
  values.forEach((v,i)=>{
    dots+=`<circle cx="${(i*step).toFixed(1)}" cy="${(h-v).toFixed(1)}" r="3.2" fill="${dotColor}"/>`;
  });
  const grids=[25,50,75].map(y=>`<line x1="0" y1="${y}" x2="${w}" y2="${y}" stroke="#e2e8f0" stroke-width=".6"/>`).join('');
  return `<svg viewBox="0 0 200 100" preserveAspectRatio="none" style="width:100%;height:120px;display:block">
    ${grids}
    <polyline points="${pts}" fill="none" stroke="${lineColor}" stroke-width="2" stroke-linejoin="round"/>
    ${dots}
  </svg>`;
}

function donutChart(segs, colors, labels){
  const r=36, cx=50, cy=50, C=2*Math.PI*r;
  let off=0, circles='';
  segs.forEach((p,i)=>{
    const dash=(p/100)*C;
    circles+=`<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${colors[i]}" stroke-width="13" stroke-dasharray="${dash.toFixed(1)} ${(C-dash).toFixed(1)}" stroke-dashoffset="${(-off).toFixed(1)}"/>`;
    off+=dash;
  });
  const legend=segs.map((p,i)=>`<span class="lg-item"><i style="background:${colors[i]}"></i>${labels[i]} <b>${p}%</b></span>`).join('');
  return `<div class="donut-wrap">
    <svg viewBox="0 0 100 100" style="width:130px;height:130px;flex:0 0 auto">
      <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="#eef2f7" stroke-width="13"/>
      <g transform="rotate(-90 ${cx} ${cy})">${circles}</g>
    </svg>
    <div class="legend">${legend}</div>
  </div>`;
}

function gaugeChart(pct, color){
  const r=36, cx=50, cy=50, C=2*Math.PI*r;
  const dash=(pct/100)*C;
  return `<div class="donut-wrap">
    <svg viewBox="0 0 100 100" style="width:130px;height:130px;flex:0 0 auto">
      <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="#eef2f7" stroke-width="13"/>
      <g transform="rotate(-90 ${cx} ${cy})">
        <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${color}" stroke-width="13"
          stroke-dasharray="${dash.toFixed(1)} ${(C-dash).toFixed(1)}" stroke-linecap="round"/>
      </g>
      <text x="50" y="47" text-anchor="middle" font-size="17" font-weight="800" fill="#0f172a" font-family="Segoe UI,Arial">${pct}%</text>
      <text x="50" y="61" text-anchor="middle" font-size="7" font-weight="700" fill="#94a3b8" font-family="Segoe UI,Arial" letter-spacing="1">DONE</text>
    </svg>
  </div>`;
}

/* =========================================================
   SCENARIO DATA
   ========================================================= */
const scenarios = [
  /* ---------------- 1. PERFORMANCE REVIEW ---------------- */
  {
    id:1,
    icon:'📊',
    theme:'Performance Review',
    c1:'#6366f1', c2:'#0ea5e9',
    scenario:'You work at <strong>Nordwind</strong>, a software company. You are a junior marketing specialist. Your manager, <strong>Sofia</strong>, gives you your yearly review. She says your results are good, but your reports are often late. Your job is to talk with her, understand the feedback, and agree on a plan.',
    stats:[
      ['Employee','You'],
      ['Role','Junior Marketing Specialist'],
      ['Time in company','14 months'],
      ['Reports on time','7 of 12'],
      ['Average delay','2 days'],
      ['Campaign results','112% of goal'],
      ['Team feedback','4.2 / 5'],
      ['Rating this year','3 / 5'],
      ['Salary raise','Not decided yet']
    ],
    charts:[
      { title:'Campaign results index — 12 months', svg: areaChart([62,68,60,74,80,76,88,92,86,96,104,112], '#14b8a6') },
      { title:'Why the rating is 3/5', svg: barChart([45,30,25], ['#f97316','#ef4444','#6366f1']) },
      { title:'Overall rating', svg: donutChart([60,40], ['#6366f1','#e2e8f0'], ['Score','Missing']) },
      { title:'Reports sent on time (per quarter)', svg: lineDots([75,50,60,85], '#ef4444', '#38bdf8') }
    ],
    mission:[
      'Listen to the feedback. Do not argue.',
      'Ask for one clear example.',
      'Say what you will change.',
      'Agree on 2 goals and a follow-up date.'
    ],
    cues:[
      '"Thank you for the feedback. Can you give me an example?"',
      '"I understand. My reports were late 5 times."',
      '"What do you need from me in the next 3 months?"',
      '"I will send a short update every Friday."',
      '"Can we meet again in 60 days to check my progress?"'
    ]
  },

  /* ---------------- 2. CUSTOMER COMPLAINT ---------------- */
  {
    id:2,
    icon:'📦',
    theme:'Handling a Customer Complaint',
    c1:'#ec4899', c2:'#f97316',
    scenario:'You work at <strong>FreshBox</strong>. FreshBox sells meal-kit delivery. Your customer is <strong>Anna</strong>. She is angry because her box came 17 hours late and two of her three meals were spoiled. Your job is to talk with Anna and negotiate a solution together.',
    stats:[
      ['Customer','Anna'],
      ['Customer for','2 years'],
      ['Total orders','24'],
      ['This order','#A-1042'],
      ['Product','3 dinner meals'],
      ['Price','$45'],
      ['Promised delivery','Tue 6 PM'],
      ['Actual delivery','Wed 11 AM'],
      ['Late by','17 hours'],
      ['Spoiled meals','2 of 3'],
      ['Refund request','Full refund $45']
    ],
    charts:[
      { title:'Why Anna is angry', svg: donutChart([50,30,20], ['#ec4899','#f97316','#facc15'], ['Late delivery','Spoiled food','No updates']) },
      { title:'Delivery delay by month (hours)', svg: barChart([0,2,0,5,0,17], ['#94a3b8','#94a3b8','#94a3b8','#94a3b8','#94a3b8','#ef4444']) },
      { title:'Anna\'s orders over 24 months', svg: areaChart([20,28,35,42,50,58,65,72,80,88,95,100], '#f97316') },
      { title:'Order status', svg: donutChart([33,67], ['#22c55e','#e2e8f0'], ['Good meals','Spoiled']) }
    ],
    mission:[
      'Listen first. Do not interrupt.',
      'Apologize once, clearly.',
      'Check the facts in the system.',
      'Offer a fair solution and ask if it works.',
      'Keep Anna as a customer.'
    ],
    cues:[
      '"I understand why you are upset. I am sorry."',
      '"Let me check your order right now."',
      '"I see the box was 17 hours late."',
      '"I can offer a full refund and a $10 credit. Does that work for you?"',
      '"What would feel fair to you?"',
      '"Thank you for your patience. I will fix this now."'
    ]
  },

  /* ---------------- 3. GLOBAL TEAM PITCH ---------------- */
  {
    id:3,
    icon:'🌍',
    theme:'Present a Project Idea to the Global Team',
    c1:'#0f766e', c2:'#22c55e',
    scenario:'You work at <strong>Lumina</strong>, a retail company. You have an idea to cut packaging waste. The global team meets online. People from 6 countries are on the call. You have <strong>5 minutes</strong> to present your idea and answer questions.',
    stats:[
      ['Audience','14 people'],
      ['Countries on call','6'],
      ['Time zones','4'],
      ['Your speaking time','5 minutes'],
      ['Current packaging cost','$2.1M / year'],
      ['Packaging waste','380 tons / year'],
      ['Cost of your idea','$180,000'],
      ['Expected savings','$600,000 / year'],
      ['Local team support','8 of 10'],
      ['Budget owner','Global Operations']
    ],
    charts:[
      { title:'Cost vs savings ($ thousands)', svg: barChart([180,600], ['#ef4444','#22c55e']) },
      { title:'Packaging waste over 6 years (tons)', svg: areaChart([380,360,320,270,210,150], '#22c55e') },
      { title:'Investment vs return', svg: donutChart([23,77], ['#ef4444','#22c55e'], ['Investment','Savings']) },
      { title:'Local team support', svg: gaugeChart(80, '#0f766e') }
    ],
    mission:[
      'Present the idea in 5 minutes. Keep it simple.',
      'Give clear numbers, not long stories.',
      'Ask for a small pilot, not a big budget.',
      'Answer 2 questions calmly.'
    ],
    cues:[
      '"I have one idea. It takes 5 minutes."',
      '"Today we spend $2.1 million on packaging."',
      '"My idea can save $600,000 a year."',
      '"I am not asking for the full budget. I am asking for a 3-month pilot."',
      '"Does anyone have questions?"',
      '"Could you repeat that, please? The line was not clear."'
    ]
  },

  /* ---------------- 4. NEGOTIATING PRIORITIES ---------------- */
  {
    id:4,
    icon:'⚖️',
    theme:'Negotiating Priorities and Resources',

/* =========================================================
   RENDER CARDS
   ========================================================= */
const grid = document.getElementById('grid');

scenarios.forEach((s, i)=>{
  const card = document.createElement('div');
  card.className = 'card';
  card.setAttribute('role','button');
  card.setAttribute('tabindex','0');
  card.setAttribute('aria-label', `Mystery card ${s.id}, tap to open the situation`);
  card.dataset.id = s.id;
  card.innerHTML = `
    <div class="front">
      <span class="number">${s.id}</span>
      <span class="check-box" data-check role="checkbox" aria-checked="false" tabindex="0" title="Mark as done">☐</span>
      <span class="question-mark">?</span>
      <span class="hint">Tap to reveal</span>
    </div>
  `;
  grid.appendChild(card);
});

/* =========================================================
   MODAL LOGIC
   ========================================================= */
const overlay = document.getElementById('modalOverlay');
const modal = document.getElementById('modal');
let lastFocused = null;

function openModal(id){
  const s = scenarios.find(x => x.id === id);
  if(!s) return;

  const statHTML = s.stats.map(([k,v]) =>
    `<div class="stat"><span class="lbl">${k}</span><span class="val">${v}</span></div>`
  ).join('');

  const chartHTML = s.charts.map(c =>
    `<div class="chart-card"><h4>${c.title}</h4>${c.svg}</div>`
  ).join('');

  const missionHTML = s.mission.map(m => `<li>${m}</li>`).join('');
  const cuesHTML = s.cues.map(c => `<li>${c}</li>`).join('');

  modal.style.setProperty('--mc1', s.c1);
  modal.style.setProperty('--mc2', s.c2);

  modal.innerHTML = `
    <button class="close-btn" id="closeBtn" aria-label="Close">✕</button>
    <div class="modal-head">
      <span class="num">${s.id}</span>
      <h2 id="modalTitle">${s.icon} ${s.theme}</h2>
      <p class="sub">${s.scenario}</p>
    </div>
    <div class="modal-body">
      <p class="section-title">Facts</p>
      <div class="stats">${statHTML}</div>

      <p class="section-title">Charts — read the data</p>
      <div class="charts">${chartHTML}</div>

      <div class="bottom-cols">
        <div class="panel">
          <h3>Your mission</h3>
          <ul class="mission">${missionHTML}</ul>
        </div>
        <div class="panel">
          <h3>Language cues</h3>
          <ul class="cues">${cuesHTML}</ul>
        </div>
      </div>
    </div>
  `;

  overlay.classList.add('open');
  document.body.style.overflow = 'hidden';
  lastFocused = document.activeElement;
  setTimeout(()=>document.getElementById('closeBtn').focus(), 50);

  document.getElementById('closeBtn').addEventListener('click', closeModal);
}

function closeModal(){
  overlay.classList.remove('open');
  document.body.style.overflow = '';
  if(lastFocused) lastFocused.focus();
}

overlay.addEventListener('click', e => {
  if(e.target === overlay) closeModal();
});

document.addEventListener('keydown', e => {
  if(e.key === 'Escape' && overlay.classList.contains('open')) closeModal();
});

/* =========================================================
   SOUND
   ========================================================= */
let audioCtx = null;
let soundOn = true;

function playTone(isOpen){
  if(!soundOn) return;
  try{
    if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if(audioCtx.state === 'suspended') audioCtx.resume();

    const now = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();

    osc.type = 'sine';
    osc.frequency.setValueAtTime(isOpen ? 620 : 420, now);
    osc.frequency.exponentialRampToValueAtTime(isOpen ? 1020 : 290, now + 0.1);

    gain.gain.setValueAtTime(0.0001, now);
    gain.gain.exponentialRampToValueAtTime(0.12, now + 0.012);
    gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.18);

    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start(now);
    osc.stop(now + 0.2);
  }catch(e){ /* optional */ }
}

/* =========================================================
   CARD INTERACTIONS
   ========================================================= */
const cards = document.querySelectorAll('.card');

cards.forEach(card => {
  card.addEventListener('click', e => {
    if(e.target.closest('[data-check]')) return;
    playTone(true);
    openModal(Number(card.dataset.id));
  });

  card.addEventListener('keydown', e => {
    if(e.key === 'Enter' || e.key === ' ' || e.key === 'Spacebar'){
      if(e.target.closest('[data-check]')) return;
      e.preventDefault();
      playTone(true);
      openModal(Number(card.dataset.id));
    }
  });
});

/* Check boxes */
document.querySelectorAll('[data-check]').forEach(box => {
  box.addEventListener('click', e => {
    e.stopPropagation();
    const card = box.closest('.card');
    const isDone = card.classList.toggle('done');
    box.textContent = isDone ? '✓' : '☐';
    box.setAttribute('aria-checked', isDone ? 'true' : 'false');
    playTone(isDone);
  });

  box.addEventListener('keydown', e => {
    if(e.key === 'Enter' || e.key === ' '){
      e.preventDefault();
      e.stopPropagation();
      box.click();
    }
  });
});

/* =========================================================
   RESET & SOUND TOGGLE
   ========================================================= */
document.getElementById('resetBtn').addEventListener('click', () => {
  cards.forEach(card => {
    card.classList.remove('done');
    const box = card.querySelector('[data-check]');
    box.textContent = '☐';
    box.setAttribute('aria-checked','false');
  });
  closeModal();
  playTone(false);
});

const toggle = document.getElementById('soundToggle');
toggle.addEventListener('click', e => {
  e.stopPropagation();
  soundOn = !soundOn;
  toggle.textContent = soundOn ? '🔊 Sound on' : '🔇 Sound off';
  toggle.setAttribute('aria-pressed', soundOn ? 'true' : 'false');
  if(soundOn) playTone(true);
});
</script>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>EasySpeak · A1 English Practice for Adults</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{
    --bg:#faf6ee;
    --panel:#ffffff;
    --panel-2:#fdfaf3;
    --panel-3:#f7f1e3;
    --border:#e8e0cf;
    --border-hi:#d4c9b0;
    --text:#2d2a24;
    --muted:#78716c;
    --amber:#d97706;
    --amber-dark:#b45309;
    --sage:#059669;
    --blue:#0284c7;
    --red:#dc2626;
    --gold:#ca8a04;
    --amber-soft:rgba(217,119,6,.1);
    --sage-soft:rgba(5,150,105,.1);
    --blue-soft:rgba(2,132,199,.1);
  }
  body{
    font-family:'Inter',sans-serif;
    background:
      radial-gradient(ellipse at top left, #fdf3e0 0%, transparent 55%),
      radial-gradient(ellipse at bottom right, #e8f0e4 0%, transparent 55%),
      var(--bg);
    color:var(--text);
    min-height:100vh;
    padding:22px;
  }
  .app-wrapper{
    max-width:1280px;margin:0 auto;
    background:var(--panel);
    border-radius:28px;
    border:1px solid var(--border);
    box-shadow:0 20px 60px rgba(120,113,108,.12), 0 0 0 1px rgba(217,119,6,.04);
    padding:24px 28px 20px;
  }

  /* HEADER */
  .app-header{
    display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;
    gap:14px 20px;border-bottom:1px solid var(--border);
    padding-bottom:16px;margin-bottom:18px;
  }
  .brand{display:flex;align-items:center;gap:14px}
  .brand .logo{
    font-size:22px;color:#fff;
    background:linear-gradient(135deg,var(--amber),var(--amber-dark));
    width:50px;height:50px;display:flex;align-items:center;justify-content:center;border-radius:14px;
    box-shadow:0 8px 20px rgba(217,119,6,.25);
  }
  .brand h1{font-size:21px;font-weight:800;letter-spacing:-.3px;color:var(--text)}
  .brand h1 span{background:linear-gradient(90deg,var(--amber),var(--sage));-webkit-background-clip:text;background-clip:text;color:transparent}
  .brand .sub{font-size:12.5px;font-weight:500;color:var(--muted);display:block;margin-top:2px}
  .brand .sub i{color:var(--amber);margin-right:4px}

  .xp-mini{display:flex;align-items:center;gap:12px;background:var(--panel-2);border:1px solid var(--border);border-radius:40px;padding:6px 16px}
  .xp-mini .lvl{font-size:13px;font-weight:800;color:var(--amber-dark);white-space:nowrap}
  .xp-mini .bar{width:100px;height:8px;background:rgba(120,113,108,.12);border-radius:10px;overflow:hidden;border:1px solid var(--border)}
  .xp-mini .fill{height:100%;background:linear-gradient(90deg,var(--amber),var(--sage));transition:width .4s ease}
  .xp-mini .num{font-size:12px;font-weight:700;color:var(--muted);white-space:nowrap}

  /* TABS */
  .tabs{display:flex;gap:8px;margin-bottom:20px;border-bottom:1px solid var(--border)}
  .tab{
    background:transparent;border:none;color:var(--muted);
    padding:12px 20px 14px;font-size:14.5px;font-weight:700;
    cursor:pointer;font-family:inherit;
    display:flex;align-items:center;gap:8px;
    border-bottom:2px solid transparent;
    transition:all .15s;margin-bottom:-1px;
  }
  .tab:hover{color:var(--text)}
  .tab.active{color:var(--amber);border-bottom-color:var(--amber)}
  .tab i{font-size:15px}
  .tab-count{
    background:rgba(120,113,108,.1);color:var(--muted);
    font-size:11px;font-weight:700;padding:2px 8px;border-radius:20px;margin-left:4px;
  }
  .tab.active .tab-count{background:var(--amber-soft);color:var(--amber-dark)}

  .tab-panel{display:none}
  .tab-panel.active{display:block;animation:fadeUp .3s ease-out}

  /* QUEST GRID */
  .quest-grid{
    display:grid;grid-template-columns:repeat(auto-fill, minmax(290px, 1fr));gap:16px;
  }
  .quest-card{
    background:var(--panel-2);
    border:1px solid var(--border);
    border-radius:20px;
    padding:22px 22px 20px;
    cursor:pointer;transition:all .2s;
    position:relative;overflow:hidden;
    display:flex;flex-direction:column;min-height:200px;
  }
  .quest-card::before{
    content:'';position:absolute;inset:0;
    background:radial-gradient(circle at top right, rgba(217,119,6,.08), transparent 60%);
    opacity:0;transition:opacity .25s;pointer-events:none;
  }
  .quest-card:hover{
    border-color:var(--amber);
    transform:translateY(-4px);
    box-shadow:0 16px 36px rgba(217,119,6,.15);
  }
  .quest-card:hover::before{opacity:1}
  .quest-card .tag{
    display:inline-block;font-size:10.5px;font-weight:800;letter-spacing:1.2px;
    padding:4px 12px;border-radius:40px;text-transform:uppercase;
    margin-bottom:14px;align-self:flex-start;
  }
  .quest-card .tag.everyday{background:var(--amber-soft);color:var(--amber-dark);border:1px solid rgba(217,119,6,.25)}
  .quest-card .tag.social{background:var(--sage-soft);color:var(--sage);border:1px solid rgba(5,150,105,.25)}
  .quest-card .icon{
    font-size:22px;color:var(--amber);margin-bottom:12px;
    width:44px;height:44px;display:flex;align-items:center;justify-content:center;
    background:var(--amber-soft);border:1px solid rgba(217,119,6,.2);border-radius:12px;
  }
  .quest-card h3{font-size:17px;font-weight:800;margin-bottom:8px;letter-spacing:-.2px;line-height:1.25;color:var(--text)}
  .quest-card .desc{font-size:13px;line-height:1.55;color:var(--muted);flex:1;margin-bottom:14px}
  .quest-card .footer{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;font-weight:700}
  .quest-card .stages-count{color:var(--sage)}
  .quest-card .start{color:var(--amber-dark);display:flex;align-items:center;gap:6px;transition:gap .2s}
  .quest-card:hover .start{gap:10px}
  .quest-card .done-badge{
    position:absolute;top:14px;right:14px;
    background:rgba(5,150,105,.12);color:var(--sage);
    font-size:11px;font-weight:800;padding:3px 10px;border-radius:20px;
    border:1px solid rgba(5,150,105,.3);
    display:flex;align-items:center;gap:4px;
  }

  /* WIZARD */
  .wizard{display:flex;flex-direction:column;gap:16px;animation:fadeUp .3s ease-out}
  .back-btn{
    background:transparent;border:none;color:var(--muted);
    font-family:inherit;font-size:13.5px;font-weight:700;
    cursor:pointer;display:inline-flex;align-items:center;gap:8px;
    padding:6px 0;align-self:flex-start;transition:color .15s;
  }
  .back-btn:hover{color:var(--amber)}

  .wizard-header .tag{
    display:inline-block;font-size:11px;font-weight:800;letter-spacing:1.2px;
    padding:4px 14px;border-radius:40px;text-transform:uppercase;margin-bottom:10px;
  }
  .wizard-header .tag.everyday{background:var(--amber-soft);color:var(--amber-dark);border:1px solid rgba(217,119,6,.25)}
  .wizard-header .tag.social{background:var(--sage-soft);color:var(--sage);border:1px solid rgba(5,150,105,.25)}
  .wizard-header h2{font-size:26px;font-weight:800;letter-spacing:-.3px;margin-bottom:8px;color:var(--text)}
  .wizard-header .intro{font-size:14.5px;line-height:1.6;color:var(--muted);font-style:italic;max-width:720px}

  .wizard-progress{display:flex;align-items:center;gap:14px;margin-top:4px}
  .wizard-progress .bar{flex:1;height:8px;background:rgba(120,113,108,.12);border-radius:10px;overflow:hidden;border:1px solid var(--border)}
  .wizard-progress .fill{height:100%;background:linear-gradient(90deg,var(--amber),var(--sage));transition:width .4s ease}
  .wizard-progress .text{font-size:13px;font-weight:700;color:var(--muted);white-space:nowrap}
  .wizard-progress .text b{color:var(--amber-dark)}

  .stage-pills{display:flex;flex-wrap:wrap;gap:8px}
  .stage-pill{
    background:transparent;border:1px solid var(--border);color:var(--muted);
    padding:7px 14px;border-radius:40px;font-size:12.5px;font-weight:600;
    cursor:pointer;transition:all .15s;font-family:inherit;
    display:flex;align-items:center;gap:6px;
  }
  .stage-pill:hover{border-color:var(--amber);color:var(--text)}
  .stage-pill.active{background:linear-gradient(135deg,var(--amber),var(--amber-dark));color:#fff;border-color:transparent;box-shadow:0 4px 14px rgba(217,119,6,.3)}
  .stage-pill.done{border-color:rgba(5,150,105,.5);color:var(--sage)}
  .stage-pill.done.active{background:linear-gradient(135deg,var(--sage),#047857);color:#fff}

  .stage-content{
    background:linear-gradient(180deg, rgba(217,119,6,.04), rgba(5,150,105,.03));
    border:1px solid var(--border);border-radius:18px;padding:24px 26px;
    min-height:220px;
  }
  .stage-label{font-size:11px;font-weight:800;letter-spacing:1.2px;color:var(--amber-dark);text-transform:uppercase;margin-bottom:12px;display:flex;align-items:center;gap:8px}
  .stage-prompt{font-size:18px;font-weight:600;line-height:1.55;color:var(--text);margin-bottom:20px}
  .starters-title{font-size:11px;font-weight:800;letter-spacing:1px;color:var(--sage);text-transform:uppercase;margin-bottom:10px}
  .starters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
  .starter{background:var(--sage-soft);border:1px solid rgba(5,150,105,.25);color:#065f46;padding:7px 14px;border-radius:40px;font-size:13.5px;font-weight:500;transition:all .15s}
  .starter:hover{background:rgba(5,150,105,.18);transform:translateY(-1px)}
  .word-bank{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
  .word-bank .wb-title{font-size:11px;font-weight:800;letter-spacing:1px;color:var(--gold);text-transform:uppercase;width:100%;margin-bottom:6px}
  .wb{background:rgba(202,138,4,.08);border:1px solid rgba(202,138,4,.25);color:#854d0e;padding:4px 12px;border-radius:30px;font-size:12.5px;font-weight:500}

  /* Confidence inline */
  .confidence-inline{
    margin-top:20px;padding-top:18px;border-top:1px dashed rgba(120,113,108,.25);
    display:flex;align-items:center;flex-wrap:wrap;gap:12px 16px;
  }
  .confidence-inline .lbl{font-size:13.5px;font-weight:700;color:var(--amber-dark);display:flex;align-items:center;gap:6px}
  .confidence-inline .stars{display:flex;gap:2px}
  .confidence-inline .stars button{background:none;border:none;font-size:26px;color:#d6cfbd;cursor:pointer;transition:all .15s;padding:0 3px;line-height:1}
  .confidence-inline .stars button:hover{transform:scale(1.2)}
  .confidence-inline .stars button.active{color:var(--amber)}
  .confidence-inline .msg{font-size:13px;color:var(--muted);font-weight:500}

  .wizard-nav{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:4px}

  /* BUTTONS */
  .btn{
    background:var(--panel-2);border:1px solid var(--border);color:var(--text);
    padding:10px 22px;border-radius:40px;font-weight:700;font-size:13.5px;
    cursor:pointer;display:inline-flex;align-items:center;gap:8px;
    transition:all .15s;font-family:inherit;
  }
  .btn:hover{background:var(--panel-3);transform:translateY(-1px);border-color:var(--border-hi)}
  .btn.primary{background:linear-gradient(135deg,var(--amber),var(--amber-dark));color:#fff;border-color:transparent;box-shadow:0 6px 16px rgba(217,119,6,.25)}
  .btn.primary:hover{box-shadow:0 8px 22px rgba(217,119,6,.35)}
  .btn:disabled{opacity:.35;cursor:not-allowed;transform:none}

  /* QUICK SCENARIOS */
  .quick-intro{font-size:13.5px;color:var(--muted);margin-bottom:16px;display:flex;align-items:center;gap:8px}
  .quick-intro i{color:var(--amber)}
  .quick-grid{
    display:grid;grid-template-columns:repeat(auto-fill, minmax(250px, 1fr));gap:14px;
  }
  .quick-card{
    background:var(--panel-2);
    border:1px solid var(--border);
    border-radius:16px;padding:18px 20px;cursor:pointer;
    transition:all .2s;position:relative;overflow:hidden;
  }
  .quick-card::before{
    content:'';position:absolute;inset:0;
    background:radial-gradient(circle at top right, rgba(5,150,105,.08), transparent 60%);
    opacity:0;transition:opacity .25s;pointer-events:none;
  }
  .quick-card:hover{border-color:var(--border-hi);transform:translateY(-2px);box-shadow:0 10px 22px rgba(120,113,108,.12)}
  .quick-card:hover::before{opacity:1}

  .quick-card .qc-head{display:flex;align-items:flex-start;gap:12px}
  .quick-card .qc-icon{
    font-size:16px;color:var(--amber);
    width:38px;height:38px;flex-shrink:0;
    display:flex;align-items:center;justify-content:center;
    background:var(--amber-soft);border:1px solid rgba(217,119,6,.2);border-radius:10px;
  }
  .quick-card .qc-body{flex:1;min-width:0}
  .quick-card .qc-tag{font-size:10px;font-weight:800;letter-spacing:1.2px;color:var(--sage);text-transform:uppercase;margin-bottom:4px;display:block}
  .quick-card .qc-title{font-size:14.5px;font-weight:700;line-height:1.3;letter-spacing:-.1px;color:var(--text)}
  .quick-card .qc-meta{font-size:11.5px;color:var(--muted);font-weight:600;margin-top:6px;display:flex;align-items:center;gap:6px}
  .quick-card .qc-meta i{font-size:10px}
  .quick-card .qc-featured{
    position:absolute;top:12px;right:12px;
    background:rgba(202,138,4,.12);color:var(--gold);
    font-size:10px;font-weight:800;padding:3px 8px;border-radius:20px;
    border:1px solid rgba(202,138,4,.3);
  }

  .quick-card.expanded{
    grid-column:1 / -1;border-color:var(--amber);
    box-shadow:0 0 0 1px rgba(217,119,6,.2), 0 16px 36px rgba(217,119,6,.1);
    cursor:default;
  }
  .quick-card.expanded:hover{transform:none}
  .quick-card.expanded .qc-head{padding-right:32px}
  .qc-expanded-body{
    margin-top:18px;padding-top:16px;
    border-top:1px dashed rgba(120,113,108,.25);
    animation:fadeUp .25s ease-out;
  }
  .qc-expanded-body .qc-q-label{
    font-size:11px;font-weight:800;letter-spacing:1.2px;color:var(--amber-dark);
    text-transform:uppercase;margin-bottom:10px;
    display:flex;align-items:center;gap:6px;
  }
  .qc-questions{display:flex;flex-direction:column;gap:10px;margin-bottom:16px}
  .qc-question{
    font-size:15px;line-height:1.55;font-weight:500;color:var(--text);
    padding:12px 16px;background:var(--amber-soft);
    border-left:3px solid var(--amber);
    border-radius:6px 12px 12px 6px;
    display:flex;align-items:flex-start;gap:12px;
  }
  .qc-question .q-num{
    font-size:12px;font-weight:800;color:var(--amber-dark);
    background:rgba(217,119,6,.18);
    width:22px;height:22px;flex-shrink:0;
    display:flex;align-items:center;justify-content:center;border-radius:50%;margin-top:1px;
  }
  .qc-starters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
  .qc-starter{background:var(--sage-soft);border:1px solid rgba(5,150,105,.25);color:#065f46;padding:6px 13px;border-radius:30px;font-size:12.5px;font-weight:500}
  .qc-actions{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
  .qc-close{
    background:var(--panel-2);border:1px solid var(--border);color:var(--muted);
    padding:7px 16px;border-radius:40px;font-size:12.5px;font-weight:700;
    cursor:pointer;font-family:inherit;transition:all .15s;
    display:inline-flex;align-items:center;gap:6px;
  }
  .qc-close:hover{color:var(--text);background:var(--panel-3)}
  .qc-open-quest{
    background:linear-gradient(135deg,var(--sage),#047857);color:#fff;
    padding:7px 16px;border-radius:40px;font-size:12.5px;font-weight:800;
    border:none;cursor:pointer;font-family:inherit;
    display:inline-flex;align-items:center;gap:6px;transition:all .15s;
  }
  .qc-open-quest:hover{transform:translateY(-1px);box-shadow:0 6px 16px rgba(5,150,105,.3)}

  /* TIP FOOTER */
  .tip-footer{
    margin-top:22px;padding:14px 20px;
    background:linear-gradient(135deg, rgba(217,119,6,.06), rgba(5,150,105,.04));
    border:1px solid rgba(217,119,6,.15);
    border-radius:14px;font-size:13.5px;line-height:1.55;color:#78350f;
    display:flex;align-items:center;gap:12px;
  }
  .tip-footer i{color:var(--amber);font-size:16px;flex-shrink:0}
  .tip-footer strong{color:var(--text)}

  @keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

  @media(max-width:600px){
    body{padding:12px}
    .app-wrapper{padding:16px;border-radius:20px}
    .brand h1{font-size:18px}
    .brand .logo{width:42px;height:42px;font-size:18px}
    .xp-mini{padding:5px 12px}
    .xp-mini .bar{width:60px}
    .tab{padding:10px 12px 12px;font-size:13px}
    .tab-count{display:none}
    .wizard-header h2{font-size:20px}
    .stage-prompt{font-size:16px}
    .stage-content{padding:18px}
    .quest-grid{grid-template-columns:1fr}
    .quick-grid{grid-template-columns:1fr}
    .wizard-nav{flex-direction:column-reverse}
    .wizard-nav .btn{width:100%;justify-content:center}
  }
</style>
</head>
<body>
<div class="app-wrapper">

  <header class="app-header">
    <div class="brand">
      <div class="logo"><i class="fas fa-comment-dots"></i></div>
      <div>
        <h1>Easy<span>Speak</span></h1>
        <span class="sub"><i class="fas fa-mug-hot"></i> A1 English · Everyday Conversations</span>
      </div>
    </div>
    <div class="xp-mini">
      <span class="lvl" id="xpLevel">Lv.1 Beginner</span>
      <div class="bar"><div class="fill" id="xpFill" style="width:0%"></div></div>
      <span class="num"><span id="xpValue">0</span> pts</span>
    </div>
  </header>

  <nav class="tabs">
    <button class="tab active" data-tab="quest">
      <i class="fas fa-comments"></i> Guided Practice
      <span class="tab-count">6 lessons</span>
    </button>
    <button class="tab" data-tab="quick">
      <i class="fas fa-list"></i> Everyday Topics
      <span class="tab-count">20 topics</span>
    </button>
  </nav>

  <!-- GUIDED PRACTICE -->
  <section class="tab-panel active" id="questPanel">
    <div class="quest-grid" id="questGrid"></div>

    <div class="wizard" id="wizard" style="display:none">
      <button class="back-btn" id="backToGrid">
        <i class="fas fa-arrow-left"></i> All lessons
      </button>

      <div class="wizard-header">
        <span class="tag" id="wizTag"></span>
        <h2 id="wizTitle"></h2>
        <p class="intro" id="wizIntro"></p>
      </div>

      <div class="wizard-progress">
        <div class="bar"><div class="fill" id="progressFill"></div></div>
        <span class="text">Step <b id="wizStageNum">1</b> / <span id="wizStageTotal">6</span></span>
      </div>

      <div class="stage-pills" id="stagePills"></div>

      <div class="stage-content" id="stageContent">
        <div class="stage-label"><i class="fas fa-bookmark" id="stageIcon"></i> <span id="stageLabel"></span></div>
        <div class="stage-prompt" id="stagePrompt"></div>
        <div class="starters-title"><i class="fas fa-comment"></i> You can say…</div>
        <div class="starters" id="stageStarters"></div>
        <div class="word-bank" id="wordBank"></div>
        <div class="confidence-inline" id="confidenceInline" style="display:none">
          <span class="lbl"><i class="fas fa-star"></i> How do you feel?</span>
          <div class="stars" id="starsContainer">
            <button data-val="1">☆</button>
            <button data-val="2">☆</button>
            <button data-val="3">☆</button>
            <button data-val="4">☆</button>
            <button data-val="5">☆</button>
          </div>
          <span class="msg" id="confidenceMsg">Tap a star</span>
        </div>
      </div>

      <div class="wizard-nav">
        <button class="btn" id="prevStageBtn"><i class="fas fa-chevron-left"></i> Back</button>
        <button class="btn primary" id="nextStageBtn">Next <i class="fas fa-chevron-right"></i></button>
      </div>
    </div>
  </section>

  <!-- EVERYDAY TOPICS -->
  <section class="tab-panel" id="quickPanel">
    <div class="quick-intro">
      <i class="fas fa-hand-pointer"></i>
      Click a topic to see the questions. Click again to close.
    </div>
    <div class="quick-grid" id="quickGrid"></div>
  </section>

  <footer class="tip-footer">
    <i class="fas fa-lightbulb"></i>
    <span><strong>Tip:</strong> <span id="tipText">Speak slowly. Short sentences are good. Take your time.</span></span>
  </footer>
</div>

<script>
(function(){
  'use strict';

  /* =========================================================
     6 GUIDED PRACTICE LESSONS (A1 adults)
     ========================================================= */
  const questScenarios = [
    {

  /* =========================================================

  let xp = 0;

  /* =========================================================
     POINTS & LEVELS
     ========================================================= */
  const LEVELS = [
    {name:'Beginner', min:0},
    {name:'Learner',  min:100},
    {name:'Speaker',  min:250},
    {name:'Fluent',   min:500},
    {name:'Master',   min:1000}
  ];
  function getLevel(x){
    let lv = LEVELS[0], idx = 1;
    for(let i=0;i<LEVELS.length;i++){ if(x >= LEVELS[i].min){ lv = LEVELS[i]; idx = i+1; } }
    return {level:idx, ...lv};
  }
  function addXP(n){
    xp += n;
    const L = getLevel(xp);
    const next = LEVELS[L.level] || null;
    const cur = L.min;
    const span = next ? (next.min - cur) : 1;
    const prog = next ? Math.min(100, ((xp - cur)/span)*100) : 100;
    xpFill.style.width = prog + '%';
    xpLevel.textContent = 'Lv.' + L.level + ' ' + L.name;
    xpValue.textContent = xp;
  }

      t.classList.add('active');
      const target = t.dataset.tab === 'quest' ? 'questPanel' : 'quickPanel';
      $(target).classList.add('active');
    });

    document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));

  /* =========================================================
     QUEST GRID
     ========================================================= */
  function renderQuestGrid(){
    questGrid.innerHTML = '';
    questGrid.style.display = 'grid';
    wizard.style.display = 'none';

    questScenarios.forEach((q, i) => {
      const card = document.createElement('div');
      card.className = 'quest-card';
      const done = completedQuests.has(i);
      card.innerHTML = `
        ${done ? '<div class="done-badge"><i class="fas fa-check"></i> Done</div>' : ''}
        <span class="tag ${q.type}">${q.tag}</span>
        <div class="icon"><i class="fas ${q.icon}"></i></div>
        <h3>${q.title}</h3>
        <p class="desc">${q.intro}</p>
        <div class="footer">
          <span class="stages-count"><i class="fas fa-list-check"></i> ${q.stages.length} steps</span>
          <span class="start">Start <i class="fas fa-arrow-right"></i></span>
        </div>
      `;
      card.addEventListener('click', () => openQuest(i));
      questGrid.appendChild(card);
    });
  }

  /* =========================================================
     WIZARD
     ========================================================= */
  function openQuest(idx){
    curQuest = idx;
    curStage = 0;
    questGrid.style.display = 'none';
    wizard.style.display = 'flex';
    window.scrollTo({top:0, behavior:'smooth'});
    renderWizard();
  }

  function closeQuest(){
    questGrid.style.display = 'grid';
    wizard.style.display = 'none';
    renderQuestGrid();
    window.scrollTo({top:0, behavior:'smooth'});
  }

  function renderWizard(){
    const q = questScenarios[curQuest];
    wizTag.textContent = q.tag;
    wizTag.className = 'tag ' + q.type;
    wizTitle.textContent = q.title;
    wizIntro.textContent = q.intro;
    wizStageTotal.textContent = q.stages.length;

    // pills
    stagePills.innerHTML = '';
    q.stages.forEach((st, i) => {
      const b = document.createElement('button');
      b.className = 'stage-pill';
      const key = curQuest + '-' + i;
      if(visitedStages.has(key)) b.classList.add('done');
      if(i === curStage) b.classList.add('active');
      b.innerHTML = `<i class="fas ${st.icon}"></i> ${i+1}. ${st.label}`;
      b.addEventListener('click', () => { curStage = i; renderWizard(); });
      stagePills.appendChild(b);
    });

    // progress
    const pct = ((curStage + 1) / q.stages.length) * 100;
    progressFill.style.width = pct + '%';
    wizStageNum.textContent = curStage + 1;

    // stage content
    const st = q.stages[curStage];
    stageIcon.className = 'fas ' + st.icon;
    stageLabel.textContent = st.label;
    stagePrompt.textContent = st.prompt;
    stageStarters.innerHTML = st.starters.map(s => `<span class="starter">${s}</span>`).join('');
    wordBank.innerHTML = '<span class="wb-title"><i class="fas fa-book"></i> Useful words</span>' +
      q.wordBank.map(w => `<span class="wb">${w}</span>`).join('');

    // stars on last stage only
    const isLast = curStage === q.stages.length - 1;
    confidenceInline.style.display = isLast ? 'flex' : 'none';
    if(isLast) updateStarsUI();

    // mark visited
    const key = curQuest + '-' + curStage;
    if(!visitedStages.has(key)){
      visitedStages.add(key);
      addXP(10);
      checkQuestComplete();
      stagePills.querySelectorAll('.stage-pill').forEach((p, i) => {
        if(visitedStages.has(curQuest + '-' + i)) p.classList.add('done');
      });
    }

    // buttons
    prevStageBtn.disabled = (curStage === 0);
    if(isLast){
      nextStageBtn.innerHTML = 'Finish <i class="fas fa-check"></i>';
    } else {
      nextStageBtn.innerHTML = 'Next <i class="fas fa-chevron-right"></i>';
    }

    // animate
    const sc = $('stageContent');
    sc.style.animation = 'none';
    void sc.offsetWidth;
    sc.style.animation = 'fadeUp .3s ease-out';
  }

  function checkQuestComplete(){
    const q = questScenarios[curQuest];
    let all = true;
    for(let i=0;i<q.stages.length;i++){
      if(!visitedStages.has(curQuest + '-' + i)){ all = false; break; }
    }
    if(all && !completedQuests.has(curQuest)){
      completedQuests.add(curQuest);
      addXP(50);
    }
  }

  nextStageBtn.addEventListener('click', () => {
    const q = questScenarios[curQuest];
    if(curStage < q.stages.length - 1){
      curStage++;
      renderWizard();
      window.scrollTo({top:0, behavior:'smooth'});
    } else {
      checkQuestComplete();
      closeQuest();
    }
  });

  prevStageBtn.addEventListener('click', () => {
    if(curStage > 0){
      curStage--;
      renderWizard();
    }
  });

  backToGrid.addEventListener('click', closeQuest);

  /* =========================================================
     STARS
     ========================================================= */
  function updateStarsUI(){
    const rating = ratedQuests.get(curQuest) || 0;
    starsContainer.querySelectorAll('button').forEach((b, i) => {
      const val = i + 1;
      b.textContent = val <= rating ? '★' : '☆';
      b.classList.toggle('active', val <= rating);
    });
    if(rating){
      const labels = {1:'A little hard', 2:'Okay', 3:'Good', 4:'Very good', 5:'Easy!'};
      confidenceMsg.textContent = `⭐ ${rating}/5 · ${labels[rating]}`;
    } else {
      confidenceMsg.textContent = 'Tap a star';
    }
  }
  starsContainer.addEventListener('click', (e) => {
    const b = e.target.closest('button');
    if(!b) return;
    const v = parseInt(b.dataset.val, 10);
    const wasEmpty = !ratedQuests.has(curQuest);
    ratedQuests.set(curQuest, v);
    updateStarsUI();
    if(wasEmpty) addXP(25);
  });

    quickGrid.innerHTML = '';

      card.className = 'quick-card';
      card.innerHTML = `
        <div class="qc-head">
          <div class="qc-icon"><i class="fas ${sc.icon}"></i></div>
          <div class="qc-body">
            <span class="qc-tag">${sc.tag}</span>
            <div class="qc-title">${sc.title}</div>
            <div class="qc-meta"><i class="fas fa-comments"></i> ${sc.questions.length} questions</div>
          </div>
        </div>
        <div class="qc-expanded-body" style="display:none"></div>
      `;
      card.addEventListener('click', (e) => {
        if(e.target.closest('.qc-close') || e.target.closest('.qc-open-quest')) return;
        toggleQuick(i);
      });
      quickGrid.appendChild(card);

  function toggleQuick(i){
    const cards = quickGrid.querySelectorAll('.quick-card');
    if(expandedQuick === i){
      cards[i].classList.remove('expanded');
      cards[i].querySelector('.qc-expanded-body').style.display = 'none';
      expandedQuick = -1;
      return;
    }
    if(expandedQuick >= 0){
      cards[expandedQuick].classList.remove('expanded');
      cards[expandedQuick].querySelector('.qc-expanded-body').style.display = 'none';
    }
    const sc = quickScenarios[i];
    const body = cards[i].querySelector('.qc-expanded-body');
    const starters = getQuickStarters(sc.tag);
    body.innerHTML = `
      <div class="qc-q-label"><i class="fas fa-question-circle"></i> Answer these questions</div>
      <div class="qc-questions">
        ${sc.questions.map((q, idx) => `
          <div class="qc-question">
            <span class="q-num">${idx + 1}</span>
            <span>${q}</span>
          </div>
        `).join('')}
      </div>
      <div class="qc-q-label" style="color:var(--sage)"><i class="fas fa-comment"></i> You can say…</div>
      <div class="qc-starters">
        ${starters.map(s => `<span class="qc-starter">${s}</span>`).join('')}
      </div>
      <div class="qc-actions">
        <button class="qc-close"><i class="fas fa-times"></i> Close</button>
      </div>
    `;
    cards[i].classList.add('expanded');
    body.style.display = 'block';
    expandedQuick = i;

    body.querySelector('.qc-close').addEventListener('click', (e) => {
      e.stopPropagation();
      toggleQuick(i);
    });

    if(!openedQuick.has(i)){
      openedQuick.add(i);
      addXP(5);
    }
  }

  function getQuickStarters(tag){
    if(tag === 'Daily life') return ['I usually…','Every day, I…','In the morning, I…','I like to…'];
    if(tag === 'People') return ['My… is…','He / She is…','We like to…','I love them because…'];
    if(tag === 'Activities') return ['I like…','I play…','I go…','It is fun because…'];
    if(tag === 'Plans') return ['I want to…','I would like to…','Next year, I…','My dream is…'];
    if(tag === 'Opinion') return ['I think…','In my opinion…','For me…','Because…'];
    return ['I think…','I like…','Because…'];
  }

  let tipIdx = 0;
  setInterval(() => {
    tipIdx = (tipIdx + 1) % tips.length;

  renderQuestGrid();
  renderQuickGrid();
  addXP(0);

})();

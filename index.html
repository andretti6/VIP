<style>

.you-badge{margin-left:auto;font-size:10px;font-weight:800;text-transform:uppercase;color:#fff;background:#16a34a;padding:3px 10px;border-radius:30px}

.q-card.solved{border-color:#16a34a;background:linear-gradient(180deg,#f3fdf7,#eafaf1)}
.q-head{display:flex;align-items:flex-start;gap:10px;margin-bottom:10px}
.q-num{width:26px;height:26px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;flex-shrink:0;background:#eaf1ff;color:#1d4ed8}

.feedback{margin-top:9px;font-size:12.5px;font-weight:700;padding:8px 12px;border-radius:9px}

.teamwork{margin-top:16px;background:linear-gradient(135deg,#16a34a,#0d9488);border-radius:16px;padding:16px 20px;color:#fff;display:flex;align-items:center;gap:14px}

.step-nav{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;background:#fff;border:1px solid #e6eef6;border-radius:20px;padding:12px 16px;box-shadow:0 10px 26px rgba(20,45,80,.08);margin-top:22px;position:sticky;bottom:14px;z-index:100}
.step-dots{display:flex;gap:6px}
.step-dot{width:26px;height:26px;border-radius:50%;border:2px solid #dbe7f1;background:#fff;color:#6b8299;font:800 10.5px 'Inter',sans-serif;cursor:pointer}
.step-dot.active{background:#1d4ed8;border-color:#1d4ed8;color:#fff;width:32px;border-radius:15px}
.toast{position:fixed;bottom:88px;left:50%;transform:translateX(-50%);background:#1d4ed8;color:#fff;padding:12px 22px;border-radius:40px;font-size:13.5px;font-weight:700;box-shadow:0 12px 30px rgba(29,78,216,.35);z-index:1000;max-width:90vw;text-align:center}
.toast.success{background:#16a34a}.toast.gold{background:#d97706}

</style>

<body>

<div class="join-screen" id="joinScreen">
  <div class="join-brand">
    <div class="join-logo"><i class="fas fa-comments"></i></div>
    <div><h1>Speak &amp; Dictate <span>· Team Activity</span></h1><p>2 speaking rounds · 2 listening dictations</p></div>
  </div>
  <div class="room-info"><i class="fas fa-users"></i> You are joining room <b id="roomNameDisplay"></b></div>
  <div class="field"><label for="nameInput">Your name</label>
    <input id="nameInput" type="text" maxlength="24" placeholder="Type your name here" autocomplete="off" /></div>
  <button type="button" class="btn wide" id="joinBtn"><i class="fas fa-arrow-right-to-bracket"></i> Join the room</button>
  <div class="join-error hidden" id="joinError"></div>
  <p class="join-hint">Everyone on this page is in the same room. The system will assign you Player A, B, or C automatically.</p>
</div>

<div class="app hidden" id="mainApp">
  <div class="topbar">
    <div class="room-chip"><i class="fas fa-users"></i> Room <b id="roomCode"></b></div>
    <div class="me-chip A" id="meChip"><span class="me-dot" id="meInitial">?</span><b id="meName"></b><span id="meRole"></span></div>
    <button type="button" class="btn warn hidden" id="resetBtn"><i class="fas fa-eraser"></i> Reset everything</button>
    <button class="leave-btn" id="leaveBtn"><i class="fas fa-right-from-bracket"></i> Leave</button>
  </div>
  <div class="location-banner">
    <div class="loc-info"><i class="fas fa-location-dot"></i><span class="loc-step-num" id="locNum"></span><span id="locTitle"></span></div>
    <div class="loc-team-score"><i class="fas fa-trophy"></i> Team <b id="teamScore">0</b> pts</div>
    <button type="button" class="loc-guide-btn hidden" id="guideBtn"><i class="fas fa-paper-plane"></i> Send class here</button>
  </div>
  <div id="sections"></div>
  <nav class="step-nav">
    <button class="btn soft" id="prevStep"><i class="fas fa-arrow-left"></i> Previous</button>
    <div class="step-dots" id="stepDots"></div>
    <button class="btn" id="nextStep">Next <i class="fas fa-arrow-right"></i></button>
  </nav>
  <p class="footer-note">All situations here are imaginary and used only to practise English.</p>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script>
(function () {
'use strict';
const FIREBASE_URL = 'https://english-meetings-f08e4-default-rtdb.firebaseio.com';
const ROOM = 'SPEAKDICTATE';
const GHOSTS = ['andre prof','prof andre','andre professor','professor andre','prof. andre','andre prof.'];
const CLIENT_ID = 'c_' + Math.random().toString(36).slice(2, 10) + Date.now().toString(36);
const KEY = 'speak-dictate-v1';
const ROLES = ['A','B','C'];
const TURN_MS = 5 * 60 * 1000;
const COLORS = [['#1d4ed8','#eaf1ff'],['#0f766e','#e3f5f2'],['#b45309','#fff4e0']];

/* ---------------- DATA ---------------- */
const STEPS = [
 { type:'speak', id:'s1', title:'Speaking 1 · Ask your friends', topics:[
   { n:'A birthday party', i:'fa-cake-candles', d:'Imagine the last great party you went to.', c:['guests','food','music','presents','games'] },
   { n:'A trip abroad', i:'fa-plane', d:'Think about a place you would like to visit.', c:['hotel','tickets','weather','sightseeing','food'] },
   { n:'A weekend of sport', i:'fa-futbol', d:'Think about the sports people play or watch.', c:['team','training','stadium','win','injury'] } ] },
 { type:'dict', id:'d1', title:'Listening Dictation 1 · Careers and the future of work', texts:[
   { t:'Three years ago, Camila left her job as an accountant to become a web developer. She studied online for eight months and worked at night to pay for her course. Now she earns more than before and works for a company in Lisbon, but she says the first year was very hard.',
     q:[['What was Camila\'s old job?',['Teacher','Accountant','Nurse'],1],['How long did she study online?',['Eight months','Eighteen months','Eight weeks'],0],['How did she pay for her course?',['She won a scholarship','She borrowed money','She worked at night'],2],['Where does she work now?',['Lisbon','Madrid','London'],0]] },
   { t:'More companies now let employees work from home, and many people like it because they save time and money on transport. However, some workers feel lonely, and managers worry about teamwork. One solution is a hybrid model: three days at home and two days in the office.',
     q:[['Why do many people like working from home?',['They earn more','They save time and money','They have longer holidays'],1],['What do some workers feel?',['Lonely','Bored','Angry'],0],['What do managers worry about?',['Salaries','Equipment','Teamwork'],2],['What is the hybrid model?',['Three days at home, two in the office','Two days at home, three in the office','Every day at home'],0]] },
   { t:'Artificial intelligence is changing many jobs. Experts say it will not replace all workers, but it will change the tasks people do. Workers who learn to use new tools will have better chances. A recent report says that by 2030, about one in five employees will need to learn new skills.',
     q:[['What will artificial intelligence change?',['The tasks people do','The office buildings','The salaries'],0],['Who will have better chances?',['Young workers only','People who work longer hours','Workers who learn new tools'],2],['Which year does the report mention?',['2025','2030','2040'],1],['How many employees will need new skills?',['One in ten','One in three','One in five'],2]] } ] },
 { type:'speak', id:'s3', title:'Speaking 2 · Ask your friends', topics:[
   { n:'Technology', i:'fa-mobile-screen', d:'Phones, apps and the things we use every day.', c:['app','battery','screen','internet','social media'] },
   { n:'Pets and animals', i:'fa-dog', d:'Think about animals you know or would like to have.', c:['dog','cat','food','vet','walk'] },
   { n:'Music and concerts', i:'fa-music', d:'Think about the songs and artists you enjoy.', c:['band','ticket','lyrics','instrument','festival'] } ] },
 { type:'dict', id:'d2', title:'Listening Dictation 2 · Living abroad and job skills', texts:[
   { t:'Marcos moved to Toronto two years ago to work as an engineer. The hardest part was the winter, because temperatures fall to minus twenty degrees. He also misses his family and Brazilian food. On the other hand, he loves the public transport and the multicultural friends he has made.',
     q:[['Which city did Marcos move to?',['Vancouver','Toronto','Dublin'],1],['What was the hardest part for him?',['The winter','The language','The paperwork'],0],['What does he miss?',['His old job','His house','His family and Brazilian food'],2],['What does he love about his new life?',['The salary','Public transport and multicultural friends','The weather'],1]] },
   { t:'Before a job interview, research the company and prepare examples of your work. Arrive ten minutes early and dress in a way that fits the company culture. At the end, ask at least one question, because it shows that you are interested. Finally, send a thank-you email the next day.',
     q:[['What should you do before the interview?',['Research the company','Call the manager','Buy new clothes'],0],['When should you arrive?',['Thirty minutes early','Ten minutes early','Exactly on time'],1],['Why should you ask a question?',['To finish faster','To ask about salary','To show interest'],2],['When should you send a thank-you email?',['The next day','The same night','The next week'],0]] },
   { t:'Some countries are testing a four-day work week with the same salary. In one trial, sixty companies took part for six months. Most of them said that workers were happier and less tired, and productivity stayed the same. Only a few companies decided to go back to five days.',
     q:[['What are some countries testing?',['A six-hour day','A four-day work week','Longer holidays'],1],['How many companies took part?',['Sixteen','Six hundred','Sixty'],2],['How long did the trial last?',['Six months','One year','Three months'],0],['What did most companies say?',['Productivity fell','Workers were unhappy','Workers were happier and less tired'],2]] } ] }
];
const ALLQ = {};

/* ---------------- STATE ---------------- */
let me = { role:null, name:'', isGhost:false };
let state = { players:{}, turns:{}, answers:{}, lastGuide:null };
let step = 0, db = null, fbOk = false, offset = 0, lastGuideId = null, solvedSeen = {}, scheduled = {};

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const now = () => Date.now() + offset;
const present = () => ROLES.filter(r => state.players && state.players[r]);
const pname = r => (state.players[r] && state.players[r].name) || ('Player ' + r);
const initials = n => (n || '?').trim().split(/\s+/).map(w => w[0]).join('').slice(0, 2).toUpperCase();
const isGhostName = n => GHOSTS.includes(String(n || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').trim());
const pts = a => a === 1 ? 3 : a === 2 ? 2 : 1;
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const arr = v => Array.isArray(v) ? v : Object.keys(v || {}).sort((a, b) => a - b).map(k => v[k]);
function toast(msg, kind) {
  const el = document.createElement('div'); el.className = 'toast ' + (kind || ''); el.textContent = msg;
  document.body.appendChild(el); setTimeout(() => el.remove(), 3000);
}

/* ---------------- DB LAYER (Firebase, with local fallback) ---------------- */
function localSet(path, val) {
  const p = path.split('/'); let o = state;
  for (let i = 0; i < p.length - 1; i++) { if (o[p[i]] == null) o[p[i]] = {}; o = o[p[i]]; }
  if (val === null) delete o[p[p.length - 1]]; else o[p[p.length - 1]] = val;
}
function localGet(path) { let o = state; for (const k of path.split('/')) { if (o == null) return null; o = o[k]; } return o == null ? null : o; }
function setPath(path, val) {
  localSet(path, val); render();
  if (fbOk) db.ref('rooms/' + ROOM + '/' + path).set(val).catch(e => console.warn(e));
}
function multi(updates) {
  Object.keys(updates).forEach(p => localSet(p, updates[p])); render();
  if (fbOk) { const u = {}; Object.keys(updates).forEach(p => u['rooms/' + ROOM + '/' + p] = updates[p]); db.ref().update(u).catch(e => console.warn(e)); }
}
function txn(path, fn) {
  if (fbOk) db.ref('rooms/' + ROOM + '/' + path).transaction(fn, () => {});
  else { const r = fn(localGet(path)); if (r !== undefined) { localSet(path, r); render(); } }
}
function initFirebase() {
  if (typeof firebase === 'undefined' || !firebase.initializeApp) return;
  try {
    firebase.initializeApp({ databaseURL: FIREBASE_URL }); db = firebase.database(); fbOk = true;
    db.ref('.info/serverTimeOffset').on('value', s => { offset = s.val() || 0; });
  } catch (e) { console.warn(e); }
}

/* ---------------- JOIN ---------------- */
$('roomNameDisplay').textContent = ROOM;
try { const s = JSON.parse(localStorage.getItem(KEY) || '{}'); if (s.name) $('nameInput').value = s.name; } catch (e) {}
function joinErr(m) { const e = $('joinError'); e.textContent = m; e.classList.toggle('hidden', !m); }
$('joinBtn').addEventListener('click', async () => {
  const name = $('nameInput').value.trim(); joinErr('');
  if (!name) return joinErr('Please write your name.');
  me.name = name; me.isGhost = isGhostName(name);
  try { localStorage.setItem(KEY, JSON.stringify({ name })); } catch (e) {}
  $('joinBtn').disabled = true;
  try { if (me.isGhost) me.role = 'ghost'; else await claimSlot(); finalizeJoin(); }
  catch (err) { joinErr(err.message || 'Could not join.'); $('joinBtn').disabled = false; }
});
function claimSlot() {
  return new Promise((resolve, reject) => {
    if (!fbOk) { me.role = 'A'; state.players = { A: { name: me.name } }; return resolve(); }
    db.ref('rooms/' + ROOM + '/players').transaction(cur => {
      cur = cur || {};
      for (const r of ROLES) if (cur[r] && cur[r].clientId === CLIENT_ID) return cur;
      for (const r of ROLES) if (!cur[r]) { cur[r] = { name: me.name, clientId: CLIENT_ID, ts: Date.now() }; return cur; }
      return;
    }, (err, ok, snap) => {
      if (err) return reject(new Error('Connection error. Please try again.'));
      if (!ok) return reject(new Error('Room is full (3 players max).'));
      const f = snap.val() || {}; const r = ROLES.find(x => f[x] && f[x].clientId === CLIENT_ID);
      if (!r) return reject(new Error('Could not claim a slot. Try again.'));
      me.role = r; try { db.ref('rooms/' + ROOM + '/players/' + r).onDisconnect().remove(); } catch (e) {}
      resolve();
    });
  });
}
function finalizeJoin() {
  $('joinScreen').classList.add('hidden'); $('mainApp').classList.remove('hidden');
  $('roomCode').textContent = ROOM; $('meName').textContent = me.name;
  $('meInitial').textContent = me.isGhost ? '👻' : initials(me.name);
  $('meRole').textContent = me.isGhost ? 'Teacher view' : 'Player ' + me.role;
  $('meChip').className = 'me-chip ' + (me.isGhost ? 'ghost' : me.role);
  if (me.isGhost) { $('guideBtn').classList.remove('hidden'); $('resetBtn').classList.remove('hidden'); }
  render();
  if (!fbOk) return;
  db.ref('rooms/' + ROOM).on('value', snap => {
    const v = snap.val() || {};
    state.players = v.players || {}; state.turns = v.turns || {}; state.answers = v.answers || {}; state.lastGuide = v.lastGuide || null;
    if (state.lastGuide && state.lastGuide.pushId !== lastGuideId) {
      if (!me.isGhost && lastGuideId !== null) { step = Number(state.lastGuide.step) || 0; toast('📍 Teacher: "Go to ' + STEPS[step].title + '"', 'gold'); }
      lastGuideId = state.lastGuide.pushId;
    }
    if (!Object.keys(state.answers).length) solvedSeen = {};
    render();
  }, () => { fbOk = false; render(); });
}

/* ---------------- TURN LOGIC ---------------- */
function startRound(st) {
  const pr = present();
  if (pr.length < 2) return toast('You need at least 2 players to start.', 'gold');
  setPath('turns/' + st.id, { order: shuffle(pr), idx: 0, t0: now(), done: false });
}
function advance(stId, expIdx) {
  txn('turns/' + stId, c => {
    if (!c || c.done || c.idx !== expIdx) return c;
    const order = arr(c.order);
    present().forEach(r => { if (!order.includes(r)) order.push(r); });
    let i = c.idx + 1;
    while (i < order.length && !state.players[order[i]]) i++;
    return { order, idx: i, t0: now(), done: i >= order.length };
  });
}
function fmt(ms) { ms = Math.max(0, ms); const s = Math.ceil(ms / 1000); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); }
setInterval(() => {
  if (!me.role) return;
  STEPS.forEach(st => {
    const T = state.turns[st.id]; if (!T || T.done) return;
    const order = arr(T.order), cur = order[T.idx];
    if (st.type === 'speak') {
      const rem = TURN_MS - (now() - T.t0);
      if (st.id === STEPS[step].id) { const el = $('timer'); if (el) el.textContent = fmt(rem); }
      if (rem <= 0) advance(st.id, T.idx);
    }
    if (cur && !state.players[cur] && fbOk) advance(st.id, T.idx);
  });
}, 500);

/* ---------------- DICTATION HELPERS ---------------- */
function ownerOf(n, reader) {
  const ans = present().filter(r => r !== reader);
  if (!ans.length) return null;
  return ans.length === 1 ? ans[0] : ans[(n - 1) % 2];
}
const qkey = (id, idx, n) => id + '_' + idx + '_' + n;
function dictSolved(st, T) { return [1, 2, 3, 4].every(n => { const a = state.answers[qkey(st.id, T.idx, n)]; return a && a.correct; }); }

/* ---------------- RENDER ---------------- */
function render() {
  if (!me.role) return;
  const st = STEPS[step];
  $('sections').innerHTML = st.type === 'speak' ? speakHTML(st) : dictHTML(st);
  $('locNum').textContent = (step + 1) + ' / ' + STEPS.length;
  $('locTitle').textContent = (st.type === 'speak' ? '💬 ' : '🎧 ') + st.title;
  $('stepDots').innerHTML = STEPS.map((_, i) => `<button class="step-dot ${i === step ? 'active' : ''}" data-step="${i}" type="button">${i + 1}</button>`).join('');
  document.querySelector('.step-nav').classList.toggle('hidden', !me.isGhost);
  $('prevStep').disabled = step === 0; $('nextStep').disabled = step === STEPS.length - 1;
  let total = 0; Object.keys(state.answers).forEach(k => { const a = state.answers[k]; if (a && a.correct) total += a.points || 0; });
  $('teamScore').textContent = total;
  // auto-advance dictation after all answered
  STEPS.filter(s => s.type === 'dict').forEach(s => {
    const T = state.turns[s.id]; if (!T || T.done) return;
    const k = s.id + T.idx;
    if (dictSolved(s, T) && !scheduled[k]) { scheduled[k] = true; setTimeout(() => advance(s.id, T.idx), 3500); }
  });
  // toasts for other players' correct answers
  Object.keys(state.answers).forEach(k => {
    const a = state.answers[k]; if (!a || !a.correct || solvedSeen[k]) return;
    solvedSeen[k] = true;
    if (!me.isGhost && a.who !== me.role && state.players[a.who] && Object.keys(solvedSeen).length > 0) toast('✅ ' + pname(a.who) + ' got a question right (+' + (a.points || 0) + ' pts)', 'success');
  });
}

function head(st, listen) {
  return `<div class="section-head ${listen ? 'l' : ''}"><span class="sec-badge ${listen ? 'listen' : ''}"><i class="fas ${listen ? 'fa-headphones' : 'fa-comments'}"></i> ${listen ? 'Listening dictation' : 'Speaking'}</span><span class="sec-title">${esc(st.title)}</span><span class="sec-num">${step + 1} / ${STEPS.length}</span></div>`;
}
function startPanel(st, msg) {
  const pr = present();
  const info = `Here now: ${pr.length ? pr.map(pname).map(esc).join(', ') : 'nobody yet'}. `;
  if (!me.isGhost) return `<div class="panel locked"><i class="fas fa-hourglass-half ic"></i><div><strong>Wait for your teacher</strong><p>${info}Your teacher will start the round.</p></div></div>`;
  return `<div class="panel ghost"><i class="fas fa-play ic"></i><div><strong>${esc(msg)}</strong><p>${info}${pr.length < 2 ? 'Waiting for at least 2 students…' : 'The system will choose randomly.'}</p></div>
  <button type="button" class="btn" style="margin-left:auto" data-act="start" ${pr.length < 2 ? 'disabled' : ''}><i class="fas fa-shuffle"></i> Start (random order)</button></div>`;
}

function speakHTML(st) {
  const T = state.turns[st.id], pr = present();
  const order = T ? arr(T.order) : [];
  const n = Math.min(st.topics.length, Math.max(2, order.length, pr.length));
  const active = T && !T.done;
  let panel = '';
  if (!T) panel = startPanel(st, 'Ready to ask questions?');
  else if (T.done) panel = `<div class="panel go"><i class="fas fa-flag-checkered ic"></i><div><strong>Everyone has been the interviewer. Well done!</strong><p>All the pictures were used.</p></div>${me.isGhost ? '<button type="button" class="btn soft" style="margin-left:auto" data-act="restart">Play again</button>' : ''}</div>`;
  else {
    const cur = order[T.idx], topic = st.topics[T.idx];
    const canSkip = me.isGhost;
    const skip = canSkip ? `<button type="button" class="btn soft" data-act="skip"><i class="fas fa-forward"></i> Next turn</button>` : '';
    if (me.role === cur) panel = `<div class="panel go"><i class="fas fa-microphone ic"></i><div><strong>YOUR TURN — you are the interviewer!</strong><p>Look at “${esc(topic.n)}”. Ask your friends questions out loud. No reading from the screen.</p></div><span class="timer" id="timer">5:00</span>${skip}</div>`;
    else panel = `<div class="panel ${me.isGhost ? 'ghost' : 'locked'}"><i class="fas fa-ear-listen ic"></i><div><strong>${esc(pname(cur))} is asking questions about “${esc(topic.n)}”</strong><p>${me.isGhost ? 'Teacher view: the students speak without the screen.' : 'Listen and answer out loud. Do not look for help on the screen.'}</p></div><span class="timer" id="timer">5:00</span>${skip}</div>`;
  }
  const cards = st.topics.slice(0, n).map((t, i) => {
    const cls = !T ? '' : (T.done || i < T.idx) ? 'done' : i === T.idx ? 'now' : '';
    const asg = order[i] ? esc(pname(order[i])) : null;
    const tag = cls === 'now' ? 'Asking now' : cls === 'done' ? '✓ Done' : 'Picture ' + (i + 1);
    return `<div class="pic ${cls || (!T ? 'now' : '')}" style="--accent:${COLORS[i][0]};--tint:${COLORS[i][1]}">
      <div class="pic-icon"><i class="fas ${t.i}"></i></div><span class="pic-tag">${tag}</span>
      <h3>${esc(t.n)}</h3><p>${esc(t.d)}</p>
      <div class="chips">${t.c.map(w => `<span class="chip">${esc(w)}</span>`).join('')}</div>
      ${asg ? `<span class="who"><i class="fas fa-user"></i> ${asg}</span>` : ''}</div>`;
  }).join('');
  return `${head(st, false)}<div class="section-body">${panel}
    ${active || !T ? '' : ''}<div class="pics" data-n="${n}">${cards}</div>
    <p class="join-hint" style="border:0;padding-top:12px">Each turn lasts 5 minutes. When time is up, the next person gets the next picture. A third person adds a third picture.</p></div>`;
}

function dictHTML(st) {
  const T = state.turns[st.id];
  if (!T) return `${head(st, true)}<div class="section-body">${startPanel(st, 'Ready for the dictation?')}</div>`;
  const order = arr(T.order);
  const bar = `<div class="order">${order.map((r, i) => `<span class="${T.done || i < T.idx ? 'done' : i === T.idx ? 'now' : ''}">${T.done || i < T.idx ? '✓ ' : ''}Reader ${i + 1}: ${esc(pname(r))}</span>`).join('')}</div>`;
  if (T.done) return `${head(st, true)}<div class="section-body">${bar}<div class="panel go"><i class="fas fa-champagne-glasses ic"></i><div><strong>Great teamwork! 🎉</strong><p>Everyone has read a text.</p></div>${me.isGhost ? '<button type="button" class="btn soft" style="margin-left:auto" data-act="restart">Play again</button>' : ''}</div></div>`;
  const reader = order[T.idx], text = st.texts[T.idx], isReader = me.role === reader;
  const answerers = present().filter(r => r !== reader);
  const solved = dictSolved(st, T);
  let panel;
  if (isReader) panel = `<div class="panel go"><i class="fas fa-book-open-reader ic"></i><div><strong>YOUR TURN — read the text aloud!</strong><p>Read slowly and clearly. Only you can see this text. Your friends will answer the questions.</p></div></div>`;
  else if (me.isGhost) panel = `<div class="panel ghost"><i class="fas fa-eye ic"></i><div><strong>Teacher view — ${esc(pname(reader))} is reading</strong><p>You can see the current text and the questions.</p></div></div>`;
  else panel = `<div class="panel go"><i class="fas fa-ear-listen ic"></i><div><strong>${esc(pname(reader))} is reading. Listen and answer!</strong><p>${answerers.length > 1 ? 'You answer only your own questions. ' : 'You answer all 4 questions. '}First try = 3 pts · second = 2 pts · third = 1 pt.</p></div></div>`;
  const textBlock = (isReader || me.isGhost) ? `<div class="textcard"><small>${isReader ? 'Your text — read it aloud' : 'Current reader’s text'}</small><p>${esc(text.t)}</p></div>` : '';
  let qs = '';
  if (!isReader) {
    qs = `<div class="progress-bar">${answerers.map(r => {
      const mine = [1, 2, 3, 4].filter(n => ownerOf(n, reader) === r);
      let d = 0, p = 0; mine.forEach(n => { const a = state.answers[qkey(st.id, T.idx, n)]; if (a && a.correct) { d++; p += a.points || 0; } });
      return `<span class="prog-item"><span class="me-dot ${r}">${esc(initials(pname(r)))}</span>${esc(pname(r))} <span class="prog-count ${d === mine.length ? 'done' : ''}">${d}/${mine.length}</span>${p ? `<span class="prog-pts">${p} pts</span>` : ''}</span>`;
    }).join('') || 'Waiting for friends…'}</div>
    <div class="q-columns" data-n="${answerers.length || 1}">${answerers.map(r => `<div class="q-col"><div class="q-col-head"><span class="player-tag ${r}">Player ${r}</span>${[1, 2, 3, 4].filter(n => ownerOf(n, reader) === r).length} questions${r === me.role ? '<span class="you-badge">You</span>' : ''}</div>
      ${[1, 2, 3, 4].filter(n => ownerOf(n, reader) === r).map(n => qCard(st, T, text, n, r)).join('')}</div>`).join('')}</div>`;
  }
  const banner = solved ? `<div class="teamwork"><i class="fas fa-champagne-glasses"></i><div><strong>All answers are correct! 🎉</strong><span>The next reader is coming up…</span></div></div>` : '';
  return `${head(st, true)}<div class="section-body">${bar}${panel}${textBlock}${qs}${banner}</div>`;
}

function qCard(st, T, text, n, owner) {
  const q = text.q[n - 1], key = qkey(st.id, T.idx, n), a = state.answers[key];
  const ok = !!(a && a.correct), wrong = !!(a && !a.correct);
  const mine = owner === me.role && !me.isGhost, can = mine && !ok;
  const L = ['a', 'b', 'c'];
  const fb = ok ? `<div class="feedback ok">✅ ${esc(pname(a.who))} got it right · +${a.points} pts</div>` : wrong ? `<div class="feedback live">👀 ${esc(pname(a.who))} tried (${L[a.choice]}) — next try worth ${pts(a.attempts + 1)} pt${pts(a.attempts + 1) > 1 ? 's' : ''}</div>` : '';
  return `<div class="q-card ${ok ? 'solved' : ''} ${mine ? '' : 'not-yours'}"><div class="q-head"><span class="q-num">${n}</span><p class="q-text">${esc(q[0])}</p></div>
    <div class="options">${q[1].map((o, i) => `<button class="opt ${ok && a.choice === i ? 'correct' : ''} ${wrong && a.choice === i ? 'wrong' : ''}" type="button" data-q="${key}" data-n="${n}" data-c="${i}" ${can ? '' : 'disabled'}><span class="l">${L[i]}</span><span>${esc(o)}</span></button>`).join('')}</div>${fb}</div>`;
}

/* ---------------- EVENTS ---------------- */
$('sections').addEventListener('click', e => {
  const st = STEPS[step];
  const act = e.target.closest('[data-act]');
  if (act) {
    const a = act.dataset.act, T = state.turns[st.id];
    if (a === 'start' && me.isGhost) startRound(st);
    if (a === 'skip' && T && me.isGhost) advance(st.id, T.idx);
    if (a === 'restart' && me.isGhost) {
      const u = { ['turns/' + st.id]: null };
      Object.keys(state.answers).forEach(k => { if (k.indexOf(st.id + '_') === 0) u['answers/' + k] = null; });
      multi(u);
    }
    return;
  }
  const opt = e.target.closest('.opt');
  if (!opt || opt.disabled || me.isGhost) return;
  const T = state.turns[st.id]; if (!T || T.done) return;
  const reader = arr(T.order)[T.idx], n = Number(opt.dataset.n);
  if (ownerOf(n, reader) !== me.role) return toast('This is another player’s question.', 'gold');
  const key = opt.dataset.q, c = Number(opt.dataset.c), q = st.texts[T.idx].q[n - 1];
  const prev = state.answers[key]; if (prev && prev.correct) return;
  const attempts = ((prev && prev.attempts) || 0) + 1, correct = c === q[2];
  const data = { choice: c, correct, who: me.role, attempts, points: correct ? pts(attempts) : 0 };
  setPath('answers/' + key, data);
  if (correct) toast('🏆 +' + data.points + ' pts! ' + (attempts === 1 ? 'Perfect first try!' : 'Nice recovery!'), 'success');
});
function go(i) { if (i < 0 || i >= STEPS.length) return; step = i; render(); window.scrollTo({ top: 0, behavior: 'smooth' }); }
$('prevStep').addEventListener('click', () => go(step - 1));
$('nextStep').addEventListener('click', () => go(step + 1));
$('stepDots').addEventListener('click', e => { const d = e.target.closest('.step-dot'); if (d) go(Number(d.dataset.step)); });
$('guideBtn').addEventListener('click', () => {
  if (!me.isGhost) return;
  const g = { step, pushId: CLIENT_ID + '_' + Date.now() };
  if (fbOk) db.ref('rooms/' + ROOM + '/lastGuide').set(g).then(() => toast('📤 Class guided to: ' + STEPS[step].title, 'gold'));
  else toast('📤 (local mode) Guided to: ' + STEPS[step].title, 'gold');
});
$('resetBtn').addEventListener('click', () => {
  if (!me.isGhost || !confirm('Reset all rounds, answers and points?')) return;
  solvedSeen = {}; scheduled = {};
  multi({ turns: null, answers: null, lastGuide: null }); toast('🧹 Everything was reset', 'success');
});
$('leaveBtn').addEventListener('click', () => {
  if (!confirm('Are you sure you want to leave the room?')) return;
  if (fbOk && me.role && me.role !== 'ghost') { try { db.ref('rooms/' + ROOM + '/players/' + me.role).remove(); } catch (e) {} }
  setTimeout(() => location.reload(), 250);
});

initFirebase();
})();
</script>
</body>
</html>
